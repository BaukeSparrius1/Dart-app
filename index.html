<!doctype html>
<meta charset="utf-8">
<script>
// Darttoernooi – alle pagina's in één bestand.
// De gekozen pagina wordt bij het laden in dit document geschreven; wisselen = herladen
// met een andere pagina. Zo draait alles op hetzelfde adres en blijft cameratoegang werken.
(function () {
  var P = {"een-bord.html": "<!doctype html>\n<html lang=\"nl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Darts \u2013 1 bord<\/title>\n<style>\n  :root { --green: #0d4a2b; --green-2: #146b3e; --red: #c8102e; --red-2: #e3263f; --cream: #f2e6c9; --panel: rgba(9,46,27,.92); --muted: #b9cdbf; --bg: #04170d; --side: 32vw; }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden; font-family: system-ui, \"Segoe UI\", sans-serif; }\n\n  /* ---------- Indeling: zijpaneel (facecam + score) en bord ---------- */\n  #layout { display: flex; width: 100vw; height: 100vh; }\n  body.side-right #layout { flex-direction: row-reverse; }\n  #side { width: var(--side); flex: none; display: flex; flex-direction: column; gap: 12px; padding: 14px; background: linear-gradient(180deg, #0b3a22, var(--bg)); border-right: 6px solid var(--red); overflow: hidden; }\n  body.side-right #side { border-right: 0; border-left: 6px solid var(--red); }\n  #boardArea { position: relative; flex: 1; min-width: 0; }\n\n  .view { position: relative; overflow: hidden; background: var(--bg); }\n  #main { position: absolute; inset: 0; }\n  #pip { width: 100%; aspect-ratio: 16 / 9; flex: none; border: 3px solid var(--cream); border-radius: 10px; }\n  body.noface #pip { display: none; }\n  .pipname { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,.8)); padding: 18px 12px 8px; font-weight: 800; font-size: clamp(13px, 1.3vw, 24px); color: var(--cream); pointer-events: none; z-index: 2; }\n  .zw { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }\n  .view video { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--bg); }\n  #pip video { object-fit: cover; }\n  .view video.cover { object-fit: cover; }\n  .view video.mirror { transform: scaleX(-1); }\n  .view.zoomed { cursor: grab; } .view.dragging { cursor: grabbing; }\n  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--cream); text-align: center; padding: 16px; pointer-events: none; font-size: 14px; }\n\n  /* ---------- Scorebord ---------- */\n  .sb-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--red); color: #fff; border: 2px solid var(--cream); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 4px 12px; font-size: clamp(10px, .85vw, 15px); font-weight: 800; letter-spacing: .5px; text-transform: uppercase; }\n  .sb { background: var(--panel); border: 2px solid var(--cream); border-radius: 0 0 8px 8px; overflow: hidden; }\n  .row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid rgba(242,230,201,.15); position: relative; }\n  .row:first-child { border-top: 0; }\n  .row.active { background: var(--red); }\n  .row.active::before { content: \"\u25b6\"; position: absolute; left: 3px; top: 50%; transform: translateY(-50%); color: var(--cream); font-size: clamp(8px, .6vw, 11px); }\n  .row.won { background: var(--green-2); }\n  .team { font-size: clamp(15px, 1.5vw, 28px); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 8px; }\n  .team small { display: block; font-size: .55em; font-weight: 500; color: var(--muted); }\n  .row.active .team small { color: var(--cream); }\n  .legs { min-width: 2em; text-align: center; font-size: clamp(15px, 1.4vw, 26px); font-weight: 900; background: rgba(0,0,0,.3); border-radius: 5px; padding: 2px 6px; font-variant-numeric: tabular-nums; }\n  .rem { min-width: 2.4em; text-align: right; font-size: clamp(28px, 3.4vw, 64px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }\n  .sb-foot { display: flex; justify-content: space-between; gap: 10px; padding: 5px 12px; font-size: clamp(10px, .8vw, 14px); color: var(--muted); border-top: 1px solid rgba(242,230,201,.15); }\n  .sb-foot .co { color: var(--cream); font-weight: 800; }\n  .entry { display: flex; gap: 4px; margin-top: 6px; }\n  .entry input { flex: 1; min-width: 0; font-size: clamp(13px, 1vw, 17px); padding: 4px 8px; border-radius: 6px; border: 2px solid var(--green-2); background: #062114; color: #fff; }\n  .entry input:focus { border-color: var(--red-2); outline: none; }\n  .entry button { font-size: clamp(11px, .85vw, 14px); padding: 4px 9px; border-radius: 6px; border: 0; cursor: pointer; background: var(--red); color: #fff; font-weight: 600; }\n\n  /* ---------- Mini-klassement ---------- */\n  #standings { margin-top: auto; background: var(--panel); border: 2px solid var(--cream); border-radius: 8px; overflow: hidden; }\n  body.nostand #standings { display: none; }\n  #standings h3 { margin: 0; background: var(--green-2); padding: 4px 12px; font-size: clamp(10px, .8vw, 14px); text-transform: uppercase; letter-spacing: .5px; color: var(--cream); }\n  #standings ol { list-style: none; margin: 0; padding: 4px 6px; }\n  #standings li { display: grid; grid-template-columns: 1.8em 1fr auto; gap: 6px; padding: 3px 6px; font-size: clamp(11px, .95vw, 17px); border-radius: 4px; }\n  #standings li.playing { background: rgba(200,16,46,.45); }\n  #standings .p { color: var(--cream); font-weight: 800; text-align: center; }\n  #standings .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  #standings .t { font-weight: 800; font-variant-numeric: tabular-nums; }\n\n  /* ---------- Instellingen (zweven over het bord) ---------- */\n  #setup { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 6; background: var(--panel); border: 2px solid var(--cream); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--cream); transition: opacity .4s; }\n  #setup.hidden { opacity: 0; pointer-events: none; }\n  #setup .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }\n  #setup .grp > b { min-width: 82px; }\n  #setup select, #setup button, #setup a.nav { font-size: 13px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--cream); background: var(--green); color: #fff; text-decoration: none; cursor: pointer; }\n  #setup select { max-width: 220px; }\n  #setup .red, #setup a.nav.cur { background: var(--red); }\n  #help { font-size: 11px; color: var(--muted); }\n\n  .flash { position: fixed; left: 50%; top: 42%; transform: translate(-50%,-50%); font-size: clamp(30px, 5vw, 84px); font-weight: 900; color: var(--red-2); -webkit-text-stroke: 2px var(--cream); text-shadow: 0 0 24px #000; pointer-events: none; opacity: 0; transition: opacity .3s; text-align: center; z-index: 8; }\n  .flash.show { opacity: 1; }\n  .flash small { display: block; font-size: .38em; -webkit-text-stroke: 0; color: var(--cream); margin-top: .3em; }\n\n  /* TV-modus */\n  body.tv #setup, body.tv .undo { display: none !important; }\n  body.tv, body.tv * { cursor: none !important; }\n  body.tv .entry input { border-color: transparent; background: transparent; color: transparent; caret-color: transparent; }\n  body.tv .entry input::placeholder { color: transparent; }\n<\/style>\n<\/head>\n<body>\n<div id=\"layout\">\n  <aside id=\"side\">\n    <div class=\"view\" id=\"pip\"><div class=\"zw\"><video autoplay playsinline muted><\/video><\/div><div class=\"msg\"><\/div><div class=\"pipname\" id=\"pipname\"><\/div><\/div>\n    <div id=\"score\">\n      <div class=\"sb-head\"><span id=\"fmt\"><\/span><span id=\"legNo\"><\/span><\/div>\n      <div class=\"sb\">\n        <div class=\"row\" data-t=\"0\"><div class=\"team\"><\/div><div class=\"legs\"><\/div><div class=\"rem\"><\/div><\/div>\n        <div class=\"row\" data-t=\"1\"><div class=\"team\"><\/div><div class=\"legs\"><\/div><div class=\"rem\"><\/div><\/div>\n        <div class=\"sb-foot\"><span id=\"stats\"><\/span><span class=\"co\" id=\"co\"><\/span><\/div>\n      <\/div>\n      <div class=\"entry\">\n        <input type=\"text\" id=\"in\" inputmode=\"numeric\" placeholder=\"Score + Enter\" maxlength=\"3\" autocomplete=\"off\">\n        <button class=\"undo\" id=\"undo\" title=\"Laatste beurt ongedaan maken (U)\">\u21b6 Ongedaan<\/button>\n      <\/div>\n    <\/div>\n    <div id=\"standings\"><h3 id=\"stTitle\">Klassement<\/h3><ol id=\"stList\"><\/ol><\/div>\n  <\/aside>\n\n  <div id=\"boardArea\">\n    <div class=\"view\" id=\"main\"><div class=\"zw\"><video autoplay playsinline muted><\/video><\/div><div class=\"msg\">Camera wordt geopend\u2026<\/div><\/div>\n\n    <div id=\"setup\">\n      <div class=\"grp\"><b>Pagina<\/b>\n        <a class=\"nav cur\" href=\"een-bord.html\">1 bord<\/a><a class=\"nav\" href=\"twee-borden.html\">2 borden<\/a><a class=\"nav\" href=\"klassement.html\">Klassement<\/a>\n      <\/div>\n      <div class=\"grp\"><b>Wedstrijd<\/b>\n        <select id=\"t0\" title=\"Team 1\"><\/select><span>vs<\/span><select id=\"t1\" title=\"Team 2\"><\/select>\n        <label>Best of <select id=\"bestOf\"><\/select><\/label>\n        <label>Start <select id=\"start\"><option>201<\/option><option>301<\/option><option>501<\/option><\/select><\/label>\n        <button class=\"red\" id=\"newMatch\">Nieuwe wedstrijd<\/button>\n      <\/div>\n      <div class=\"grp\"><b>Bordcamera<\/b>\n        <select id=\"camMain\"><\/select>\n        <button data-fit=\"main\">Vullen<\/button>\n        <button data-mir=\"main\">Spiegelen<\/button>\n        <button data-reset=\"main\">Zoom reset<\/button>\n        <button id=\"swap\" title=\"Bordcamera en facecam omwisselen\">\u21c4 Wissel met facecam<\/button>\n      <\/div>\n      <div class=\"grp\"><b>Facecam<\/b>\n        <select id=\"camPip\"><\/select>\n        <button data-mir=\"pip\">Spiegelen<\/button>\n        <button data-reset=\"pip\">Zoom reset<\/button>\n        <button id=\"faceToggle\" title=\"Facecam aan/uit (C)\">Aan/uit<\/button>\n      <\/div>\n      <div class=\"grp\"><b>Indeling<\/b>\n        <button id=\"sideBtn\" title=\"Paneel links/rechts (L)\">\u21c6 Kant wisselen<\/button>\n        <button id=\"narrow\" title=\"Paneel smaller ([)\">Paneel \uff0d<\/button>\n        <button id=\"wide\" title=\"Paneel breder (])\">Paneel \uff0b<\/button>\n        <button id=\"standBtn\" title=\"Klassement in paneel aan/uit (K)\">Klassement aan/uit<\/button>\n      <\/div>\n      <div id=\"help\">H = TV-modus \u00b7 F = volledig scherm \u00b7 scrollen = zoomen \u00b7 slepen = verschuiven \u00b7 R = zoom reset \u00b7 L = kant wisselen \u00b7 [ ] = paneelbreedte \u00b7 C = facecam \u00b7 K = klassement \u00b7 U = ongedaan \u00b7 teamnamen stel je in bij Klassement<\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"flash\" id=\"flash\"><\/div>\n\n<script>\n// --- Navigatie en volledig scherm: werkt los \u00e9n binnen het gecombineerde bestand ---\nconst inShell = typeof window.dartsShow === 'function';\nfunction goPage(p) { if (inShell) window.dartsShow(p); else location.href = p; }\nfunction toggleFs() {\n  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});\n}\ndocument.addEventListener('click', e => {\n  const a = e.target.closest && e.target.closest('a[href$=\".html\"]');\n  if (a && inShell) { e.preventDefault(); goPage(a.getAttribute('href')); }\n});\n\nconst IMPOSSIBLE = new Set([163,166,169,172,173,175,176,178,179]);\nconst KEY = 'darts-match-v1';\nconst BEST_OF = [1, 3, 5, 7, 9, 11];\nconst $ = id => document.getElementById(id);\nconst store = {\n  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n};\nconst esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n/* ---------- Teams uit het klassement ---------- */\nfunction loadTournament() {\n  let T = store.get('darts-toernooi-v1');\n  if (!T || !Array.isArray(T.teams) || !T.teams.length) {\n    const cols = []; let n = 0;\n    for (let r = 1; r <= 4; r++) {\n      cols.push({ id: 'c' + (++n), name: 'Ronde ' + r, kind: 'darts' });\n      if (r < 4) cols.push({ id: 'c' + (++n), name: 'Minigame ' + r, kind: 'mini' });\n    }\n    T = { title: 'Darttoernooi', teams: [1, 2, 3, 4, 5].map(i => ({ id: 't' + i, name: 'Team ' + i })), cols, cells: {} };\n    store.set('darts-toernooi-v1', T);\n  }\n  return T;\n}\nconst TOURN = loadTournament();\nconst teamName = id => (TOURN.teams.find(t => t.id === id) || { name: '(team verwijderd)' }).name;\nconst teamIdByName = n => (TOURN.teams.find(t => t.name === n) || {}).id;\n\n/* ---------- Uitgooi-suggesties (single out) ---------- */\nconst darts = [];\nfor (let i = 20; i >= 1; i--) darts.push({ v: 3*i, l: 'T'+i });\ndarts.push({ v: 50, l: 'Bull' }, { v: 25, l: '25' });\nfor (let i = 20; i >= 1; i--) darts.push({ v: 2*i, l: 'D'+i });\nfor (let i = 20; i >= 1; i--) darts.push({ v: i, l: String(i) });\ndarts.sort((a, b) => b.v - a.v);\nconst single = {};\nfor (let i = 1; i <= 20; i++) single[3*i] = 'T'+i;\nfor (let i = 1; i <= 20; i++) single[2*i] = 'D'+i;\nsingle[50] = 'Bull'; single[25] = '25';\nfor (let i = 1; i <= 20; i++) single[i] = String(i);\nfunction checkout(r) {\n  if (r <= 0 || r > 180) return '';\n  if (single[r]) return single[r];\n  for (const a of darts) if (a.v < r && single[r - a.v]) return a.l + ' ' + single[r - a.v];\n  for (const a of darts) for (const b of darts) { const x = r - a.v - b.v; if (x > 0 && single[x]) return a.l + ' ' + b.l + ' ' + single[x]; }\n  return '';\n}\n\n/* ---------- Wedstrijdstatus ---------- */\nfunction newMatch(teams, bestOf, start) {\n  return { teams, bestOf, start, legs: [0, 0], starter: 0, turn: 0, rem: [start, start], tot: [0, 0], cnt: [0, 0], last: [null, null], winner: null, hist: [] };\n}\nconst firstTo = () => Math.ceil(S.bestOf / 2);\nlet S = store.get(KEY);\nif (!S) S = newMatch([TOURN.teams[0].id, (TOURN.teams[1] || TOURN.teams[0]).id], 3, 301);\n// oudere opgeslagen standen omzetten\nif (!S.teams) S.teams = [0, 1].map(i => teamIdByName(S.names && S.names[i]) || (TOURN.teams[i] || TOURN.teams[0]).id);\nif (!S.bestOf) S.bestOf = S.firstTo ? S.firstTo * 2 - 1 : 3;\nif (!S.start) S.start = 301;\ndelete S.names; delete S.firstTo;\nconst save = () => store.set(KEY, S);\n\nfunction fillTeamSelect(sel) {\n  sel.innerHTML = '';\n  TOURN.teams.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; sel.appendChild(o); });\n}\nfillTeamSelect($('t0')); fillTeamSelect($('t1'));\nBEST_OF.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; $('bestOf').appendChild(o); });\n\nfunction render() {\n  document.querySelectorAll('.row').forEach(r => {\n    const t = +r.dataset.t;\n    r.classList.toggle('active', S.winner === null && S.turn === t);\n    r.classList.toggle('won', S.winner === t);\n    const avg = S.cnt[t] ? (S.tot[t] / S.cnt[t]).toFixed(1) : '\u2013';\n    r.querySelector('.team').innerHTML = esc(teamName(S.teams[t])) + '<small>Gem. ' + avg + ' \u00b7 Laatste ' + (S.last[t] === null ? '\u2013' : S.last[t]) + '<\/small>';\n    r.querySelector('.legs').textContent = S.legs[t];\n    r.querySelector('.rem').textContent = S.rem[t];\n  });\n  $('fmt').textContent = S.start + ' \u00b7 Best of ' + S.bestOf;\n  $('legNo').textContent = S.winner !== null ? 'Afgelopen' : 'Leg ' + (S.legs[0] + S.legs[1] + 1);\n  const r = S.rem[S.turn];\n  $('co').textContent = S.winner === null && r <= 180 ? 'Uit: ' + checkout(r) : '';\n  $('stats').textContent = S.winner !== null\n    ? teamName(S.teams[S.winner]) + ' wint ' + S.legs[S.winner] + '\u2013' + S.legs[1 - S.winner]\n    : teamName(S.teams[S.turn]) + ' aan de beurt';\n  $('pipname').textContent = S.winner === null ? teamName(S.teams[S.turn]) : teamName(S.teams[S.winner]) + ' \ud83c\udfc6';\n  [0, 1].forEach(i => {\n    const sel = $('t' + i);\n    if (![...sel.options].some(o => o.value === S.teams[i])) { const o = document.createElement('option'); o.value = S.teams[i]; o.textContent = teamName(S.teams[i]); sel.appendChild(o); }\n    sel.value = S.teams[i];\n  });\n  $('bestOf').value = S.bestOf;\n  $('start').value = S.start;\n  renderStandings();\n}\n\n/* ---------- Mini-klassement in het zijpaneel ---------- */\nfunction cellVal(str) {\n  const s = String(str || '').replace(/\\s/g, '').replace(',', '.');\n  if (!/^[+-]?\\d+(\\.\\d+)?([+-]\\d+(\\.\\d+)?)*$/.test(s)) return 0;\n  return s.match(/[+-]?\\d+(\\.\\d+)?/g).reduce((a, b) => a + parseFloat(b), 0);\n}\nfunction renderStandings() {\n  const list = TOURN.teams.map(t => ({ t, pts: (TOURN.cols || []).reduce((a, c) => a + cellVal((TOURN.cells || {})[t.id + '|' + c.id]), 0) }))\n    .sort((a, b) => b.pts - a.pts);\n  let pos = 0;\n  $('stTitle').textContent = (TOURN.title || 'Klassement') + ' \u00b7 stand';\n  $('stList').innerHTML = list.map((x, i) => {\n    if (i === 0 || x.pts !== list[i - 1].pts) pos = i + 1;\n    const playing = S.teams.includes(x.t.id) ? ' class=\"playing\"' : '';\n    const pts = Number.isInteger(x.pts) ? x.pts : x.pts.toFixed(1);\n    return '<li' + playing + '><span class=\"p\">' + pos + '<\/span><span class=\"n\">' + esc(x.t.name) + '<\/span><span class=\"t\">' + pts + '<\/span><\/li>';\n  }).join('');\n}\n\nfunction flash(html, ms) {\n  const f = $('flash'); f.innerHTML = html; f.classList.add('show');\n  clearTimeout(flash.t); flash.t = setTimeout(() => f.classList.remove('show'), ms || 1400);\n}\n\nfunction submit(txt) {\n  if (txt === '') return;\n  if (S.winner !== null) return flash('Wedstrijd is voorbij<br><small>Start een nieuwe wedstrijd in de instellingen<\/small>', 2200);\n  if (!/^\\d{1,3}$/.test(txt)) return flash('Ongeldig');\n  const pts = parseInt(txt, 10);\n  if (pts > 180 || IMPOSSIBLE.has(pts)) return flash(pts + '?<br><small>onmogelijke score<\/small>');\n\n  const snap = JSON.parse(JSON.stringify(S)); delete snap.hist;\n  S.hist.push(JSON.stringify(snap)); if (S.hist.length > 300) S.hist.shift();\n\n  const t = S.turn, before = S.rem[t];\n  S.cnt[t]++;\n  if (pts > before) {\n    S.last[t] = 0; flash('Overgooid!'); S.turn = 1 - t;\n  } else if (pts === before) {\n    S.tot[t] += pts; S.legs[t]++;\n    if (S.legs[t] >= firstTo()) {\n      S.winner = t; S.rem[t] = 0; S.last[t] = pts;\n      flash(esc(teamName(S.teams[t])) + '<br>wint de wedstrijd!', 5000);\n    } else {\n      flash(esc(teamName(S.teams[t])) + '<br>wint de leg!', 2500);\n      S.starter = 1 - S.starter; S.turn = S.starter;\n      S.rem = [S.start, S.start]; S.last = [null, null];\n    }\n  } else {\n    S.tot[t] += pts; S.last[t] = pts; S.rem[t] = before - pts;\n    if (pts === 180) flash('180!');\n    S.turn = 1 - t;\n  }\n  render(); save();\n}\nfunction undo() {\n  const p = S.hist.pop(); if (!p) return;\n  const h = S.hist; S = Object.assign(JSON.parse(p), { hist: h });\n  render(); save();\n}\n\n$('in').addEventListener('keydown', e => {\n  if (e.key === 'Enter') { submit($('in').value.trim()); $('in').value = ''; }\n  else if (e.key === 'Escape') $('in').value = '';\n});\n$('undo').onclick = () => { undo(); $('in').focus(); };\n[0, 1].forEach(i => $('t' + i).addEventListener('change', () => { S.teams[i] = $('t' + i).value; render(); save(); }));\n$('bestOf').addEventListener('change', () => {\n  S.bestOf = +$('bestOf').value;\n  const w = [0, 1].find(i => S.legs[i] >= firstTo());\n  S.winner = w === undefined ? null : w;\n  render(); save();\n});\n$('start').addEventListener('change', () => {\n  const v = +$('start').value;\n  if (S.hist.length && !confirm('Startscore wijzigen naar ' + v + '? Dit start een nieuwe wedstrijd.')) { $('start').value = S.start; return; }\n  S = newMatch(S.teams.slice(), S.bestOf, v); render(); save();\n});\n$('newMatch').onclick = () => {\n  if (confirm('Nieuwe wedstrijd starten? De huidige stand gaat verloren.')) {\n    S = newMatch(S.teams. display: flex; gap: 4px; margin-top: 5px; align-items: center; }\n  .entry input { flex: 1; min-width: 0; font-size: clamp(12px, 0.9vw, 15px); padding: 3px 8px; border-radius: 6px; border: 2px solid var(--green-2); background: #062114; color: #fff; }\n  .entry input:focus { border-color: var(--accent); outline: none; }\n  .entry button { font-size: clamp(10px, 0.8vw, 13px); padding: 3px 8px; border-radius: 6px; border: 0; cursor: pointer; background: var(--red); color: #fff; font-weight: 600; }\n  .entry button:hover { background: var(--red-2); }\n  .flash { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); font-size: clamp(28px, 5vw, 80px); font-weight: 900; color: var(--red-2); -webkit-text-stroke: 2px var(--cream); text-shadow: 0 0 24px #000; pointer-events: none; opacity: 0; transition: opacity .3s; text-align: center; }\n  .flash.show { opacity: 1; }\n  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--cream); text-align: center; padding: 24px; pointer-events: none; font-size: 14px; }\n<\/style>\n<\/head>\n<body>\n<div id=\"wrap\"><\/div>\n<div id=\"help\">H = TV-modus (bediening verbergen) \u00b7 F = volledig scherm \u00b7 scrollen = zoomen \u00b7 slepen = verschuiven \u00b7 R = zoom reset \u00b7 Tab = ander bord<\/div>\n<div id=\"tvmsg\"><\/div>\n<nav id=\"nav\"><a href=\"een-bord.html\">1 bord<\/a><a class=\"cur\" href=\"twee-borden.html\">2 borden<\/a><a href=\"klassement.html\">Klassement<\/a><\/nav>\n\n<template id=\"tpl\">\n  <div class=\"board\">\n    <div class=\"zw\"><video autoplay playsinline muted><\/video><\/div>\n    <div class=\"msg\">Camera wordt geopend\u2026<\/div>\n    <div class=\"title\"><\/div>\n    <div class=\"controls\">\n      <label class=\"camlbl\">Camera: <select class=\"cam\" title=\"Camera voor dit bord\"><\/select><\/label>\n      <button class=\"swap\" title=\"Camera's van bord 1 en 2 omwisselen\">\u21c4 Wissel<\/button>\n      <button class=\"zin\" title=\"Inzoomen (of scrollen met de muis)\">\uff0b<\/button>\n      <button class=\"zout\" title=\"Uitzoomen\">\uff0d<\/button>\n      <button class=\"zreset\" title=\"Zoom herstellen (of dubbelklik op het beeld)\">Zoom reset<\/button>\n      <button class=\"fit\">Vullen<\/button>\n      <button class=\"mir\">Spiegelen<\/button>\n      <label class=\"ctl-lbl\">Best of <select class=\"bestof\"><\/select><\/label>\n      <label class=\"ctl-lbl\">Start <select class=\"start\"><option>201<\/option><option>301<\/option><option>501<\/option><\/select><\/label>\n      <button class=\"newgame\">Nieuwe wedstrijd<\/button>\n    <\/div>\n    <div class=\"warn\">Beide borden gebruiken dezelfde camera. Kies hierboven een andere.<\/div>\n    <div class=\"flash\"><\/div>\n    <div class=\"score\">\n      <div class=\"fmt\"><span class=\"fmt-l\"><\/span><span class=\"fmt-r\"><\/span><\/div>\n      <div class=\"players\">\n        <div class=\"player\" data-p=\"0\">\n          <select class=\"name\" title=\"Team kiezen (namen stel je in bij Klassement)\"><\/select>\n          <div class=\"rem\"><\/div>\n          <div class=\"stats\"><span>Legs <b class=\"legs\"><\/b><\/span><span>Gem. <b class=\"avg\"><\/b><\/span><span>Laatste <b class=\"last\"><\/b><\/span><\/div>\n          <div class=\"co\"><\/div>\n        <\/div>\n        <div class=\"player\" data-p=\"1\">\n          <select class=\"name\" title=\"Team kiezen (namen stel je in bij Klassement)\"><\/select>\n          <div class=\"rem\"><\/div>\n          <div class=\"stats\"><span>Legs <b class=\"legs\"><\/b><\/span><span>Gem. <b class=\"avg\"><\/b><\/span><span>Laatste <b class=\"last\"><\/b><\/span><\/div>\n          <div class=\"co\"><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"entry\">\n        <input type=\"text\" inputmode=\"numeric\" placeholder=\"Score + Enter\" maxlength=\"3\">\n        <button class=\"undo\" title=\"Laatste beurt ongedaan maken\">\u21b6 Ongedaan<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/template>\n\n<script>\n// --- Navigatie en volledig scherm: werkt los \u00e9n binnen het gecombineerde bestand ---\nconst inShell = typeof window.dartsShow === 'function';\nfunction goPage(p) { if (inShell) window.dartsShow(p); else location.href = p; }\nfunction toggleFs() {\n  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});\n}\ndocument.addEventListener('click', e => {\n  const a = e.target.closest && e.target.closest('a[href$=\".html\"]');\n  if (a && inShell) { e.preventDefault(); goPage(a.getAttribute('href')); }\n});\n\nconst IMPOSSIBLE = new Set([163,166,169,172,173,175,176,178,179]);\nconst STORE_KEY = 'darts301-v1';\n\n/* ---------- Teams uit het klassement ---------- */\nfunction loadTournament() {\n  let T = null;\n  try { T = JSON.parse(localStorage.getItem('darts-toernooi-v1')); } catch (e) {}\n  if (!T || !Array.isArray(T.teams) || !T.teams.length) {\n    const cols = []; let n = 0;\n    for (let r = 1; r <= 4; r++) {\n      cols.push({ id: 'c' + (++n), name: 'Ronde ' + r, kind: 'darts' });\n      if (r < 4) cols.push({ id: 'c' + (++n), name: 'Minigame ' + r, kind: 'mini' });\n    }\n    T = { title: 'Darttoernooi', teams: [1, 2, 3, 4, 5].map(i => ({ id: 't' + i, name: 'Team ' + i })), cols, cells: {} };\n    try { localStorage.setItem('darts-toernooi-v1', JSON.stringify(T)); } catch (e) {}\n  }\n  return T;\n}\nconst TOURN = loadTournament();\nconst teamName = id => (TOURN.teams.find(t => t.id === id) || { name: '(team verwijderd)' }).name;\nconst teamIdByName = n => (TOURN.teams.find(t => t.name === n) || {}).id;\nconst BEST_OF = [1, 3, 5, 7, 9, 11];\nconst firstTo = s => Math.ceil(s.bestOf / 2);\n\n/* ---------- Uitgooi-suggesties (single out: elke pijl mag de laatste zijn) ---------- */\nconst darts = [];\nfor (let i = 20; i >= 1; i--) darts.push({ v: 3*i, l: 'T'+i });\ndarts.push({ v: 50, l: 'Bull' });\ndarts.push({ v: 25, l: '25' });\nfor (let i = 20; i >= 1; i--) darts.push({ v: 2*i, l: 'D'+i });\nfor (let i = 20; i >= 1; i--) darts.push({ v: i, l: String(i) });\ndarts.sort((a, b) => b.v - a.v);\n// Beste losse pijl per waarde: liefst enkel, dan 25/Bull, dan dubbel, dan triple\nconst single = {};\nfor (let i = 1; i <= 20; i++) { single[3*i] = 'T'+i; }\nfor (let i = 1; i <= 20; i++) { single[2*i] = 'D'+i; }\nsingle[50] = 'Bull'; single[25] = '25';\nfor (let i = 1; i <= 20; i++) { single[i] = String(i); }\n\nfunction checkout(r) {\n  if (r <= 0 || r > 180) return '';\n  if (single[r]) return single[r];\n  for (const a of darts) if (a.v < r && single[r - a.v]) return a.l + ' ' + single[r - a.v];\n  for (const a of darts) for (const b of darts) {\n    const rest = r - a.v - b.v;\n    if (rest > 0 && single[rest]) return a.l + ' ' + b.l + ' ' + single[rest];\n  }\n  return '';\n}\n\n/* ---------- Opslag (alleen gemak; werkt ook zonder) ---------- */\nfunction load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }\nfunction save() {\n  try { localStorage.setItem(STORE_KEY, JSON.stringify({ boards: boards.map(b => b.state) })); } catch (e) {}\n}\n\n/* ---------- Spelstatus ---------- */\nfunction newMatch(teams, bestOf, start) {\n  return { teams: teams, bestOf: bestOf || 3, start: start || 301, winner: null, legs: [0, 0], starter: 0, turn: 0, rem: [start || 301, start || 301], hist: [], tot: [0, 0], cnt: [0, 0], last: [null, null] };\n}\n// Oude opgeslagen standen (met losse namen) omzetten naar teams uit het klassement\nfunction migrate(st, idx) {\n  const def = [TOURN.teams[(idx * 2) % TOURN.teams.length].id, TOURN.teams[(idx * 2 + 1) % TOURN.teams.length].id];\n  if (!st) return newMatch(def, 3, 301);\n  if (!st.teams) st.teams = [0, 1].map(i => teamIdByName(st.names && st.names[i]) || def[i]);\n  if (!st.bestOf) st.bestOf = 3;\n  if (!st.start) st.start = 301;\n  if (st.winner === undefined) st.winner = null;\n  delete st.names;\n  return st;\n}\n\nconst saved = load();\nconst boards = [];\n\nfunction makeBoard(idx) {\n  const el = document.getElementById('tpl').content.firstElementChild.cloneNode(true);\n  document.getElementById('wrap').appendChild(el);\n  const b = {\n    idx, el,\n    video: el.querySelector('video'),\n    sel: el.querySelector('.cam'),\n    input: el.querySelector('input'),\n    flash: el.querySelector('.flash'),\n    msg: el.querySelector('.msg'),\n    stream: null,\n    state: migrate(saved.boards && saved.boards[idx], idx)\n  };\n  el.querySelector('.title').innerHTML = 'Bord ' + (idx + 1) + '<span class=\"zoomlbl\"><\/span>';\n  setupZoom(b);\n  boards.push(b);\n\n  // Teamkeuze (namen komen uit het klassement)\n  el.querySelectorAll('.player').forEach(p => {\n    const sel = p.querySelector('.name'), i = +p.dataset.p;\n    TOURN.teams.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; sel.appendChild(o); });\n    sel.addEventListener('change', () => { b.state.teams[i] = sel.value; render(b); save(); b.input.focus(); });\n  });\n  const bo = el.querySelector('.bestof');\n  BEST_OF.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; bo.appendChild(o); });\n  bo.addEventListener('change', () => {\n    const s = b.state; s.bestOf = +bo.value;\n    const w = [0, 1].find(i => s.legs[i] >= firstTo(s));\n    s.winner = w === undefined ? null : w;\n    render(b); save(); b.input.focus();\n  });\n  const stSel = el.querySelector('.start');\n  stSel.addEventListener('change', () => {\n    const s = b.state, v = +stSel.value;\n    if (s.hist.length && !confirm('Startscore wijzigen naar ' + v + '? Dit start een nieuwe wedstrijd op bord ' + (idx + 1) + '.')) { stSel.value = s.start; return; }\n    b.state = newMatch(s.teams.slice(), s.bestOf, v); render(b); save(); b.input.focus();\n  });\n\n  b.input.addEventListener('keydown', e => {\n    if (e.key === 'Enter') { submit(b, b.input.value.trim()); b.input.value = ''; }\n    else if (e.key === 'Escape') { b.input.value = ''; }\n  });\n  el.querySelector('.undo').onclick = () => { undo(b); b.input.focus(); };\n  el.querySelector('.newgame').onclick = () => {\n    if (confirm('Nieuwe wedstrijd op bord ' + (idx+1) + '? De huidige stand gaat verloren.')) {\n      b.state = newMatch(b.state.teams.slice(), b.state.bestOf, b.state.start); render(b); save();\n    }\n  };\n  el.querySelector('.fit').onclick = () => b.video.classList.toggle('cover');\n  el.querySelector('.mir').onclick = () => b.video.classList.toggle('mirror');\n  b.sel.onchange = () => startCam(b, b.sel.value);\n  el.querySelector('.swap').onclick = async () => {\n    const ids = boards.map(x => curId(x));\n    await startCam(boards[0], ids[1]);\n    await startCam(boards[1], ids[0]);\n  };\n\n  render(b);\n  return b;\n}\n\n/* ---------- Zoomen en verschuiven per beeld ---------- */\n// Scrollen = zoomen naar de muispositie, slepen = verschuiven, dubbelklik = herstellen\nfunction setupZoom(b) {\n  const el = b.el, zw = el.querySelector('.zw');\n  let z = { s: 1, x: 0, y: 0 };           // x/y als fractie van de beeldbreedte/-hoogte\n  try { const sv = JSON.parse(localStorage.getItem('darts-zoom-' + b.idx)); if (sv && sv.s >= 1) z = sv; } catch (e) {}\n\n  const onPanel = t => t.closest('.score, .controls, .title, .warn');\n  function clamp() {\n    z.s = Math.min(8, Math.max(1, z.s));\n    z.x = Math.min(0, Math.max(1 - z.s, z.x));\n    z.y = Math.min(0, Math.max(1 - z.s, z.y));\n  }\n  function apply() {\n    clamp();\n    const w = el.clientWidth, h = el.clientHeight;\n    zw.style.transform = 'translate(' + (z.x * w) + 'px,' + (z.y * h) + 'px) scale(' + z.s + ')';\n    el.classList.toggle('zoomed', z.s > 1.001);\n    el.querySelector('.zoomlbl').textContent = z.s > 1.001 ? '\u00b7 ' + z.s.toFixed(1) + '\u00d7' : '';\n    try { localStorage.setItem('darts-zoom-' + b.idx, JSON.stringify(z)); } catch (e) {}\n  }\n  // Zoom naar punt (fx, fy) als fractie van het beeld\n  function zoomAt(factor, fx, fy) {\n    const ns = Math.min(8, Math.max(1, z.s * factor));\n    z.x = fx - (fx - z.x) * (ns / z.s);\n    z.y = fy - (fy - z.y) * (ns / z.s);\n    z.s = ns;\n    apply();\n  }\n  b.zoom = {\n    reset() { z = { s: 1, x: 0, y: 0 }; apply(); },\n    step(f) { zoomAt(f, 0.5, 0.5); },\n    zoomed() { return z.s > 1.001; },\n    pan(dx, dy) { z.x += dx; z.y += dy; apply(); }\n  };\n\n  el.addEventListener('wheel', e => {\n    if (onPanel(e.target)) return;\n    e.preventDefault();\n    const r = el.getBoundingClientRect();\n    zoomAt(Math.exp(-e.deltaY * 0.0015), (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);\n  }, { passive: false });\n\n  let drag = null;\n  el.addEventListener('mousedown', e => {\n    if (e.button !== 0 || onPanel(e.target) || z.s <= 1.001) return;\n    e.preventDefault();\n    drag = { x: e.clientX, y: e.clientY, zx: z.x, zy: z.y };\n    el.classList.add('dragging');\n  });\n  window.addEventListener('mousemove', e => {\n    if (!drag) return;\n    z.x = drag.zx + (e.clientX - drag.x) / el.clientWidth;\n    z.y = drag.zy + (e.clientY - drag.y) / el.clientHeight;\n    apply();\n  });\n  window.addEventListener('mouseup', () => { if (drag) { drag = null; el.classList.remove('dragging'); } });\n  el.addEventListener('dblclick', e => { if (!onPanel(e.target)) b.zoom.reset(); });\n\n  el.querySelector('.zin').onclick = () => zoomAt(1.25, 0.5, 0.5);\n  el.querySelector('.zout').onclick = () => zoomAt(0.8, 0.5, 0.5);\n  el.querySelector('.zreset').onclick = () => b.zoom.reset();\n  window.addEventListener('resize', apply);\n  apply();\n}\n\nfunction submit(b, txt) {\n  const s = b.state;\n  if (txt === '') return;\n  if (s.winner !== null) return showFlash(b, 'Wedstrijd voorbij<br><small>Kies Nieuwe wedstrijd<\/small>', 2000);\n  if (!/^\\d{1,3}$/.test(txt)) return showFlash(b, 'Ongeldig');\n  const pts = parseInt(txt, 10);\n  if (pts > 180 || IMPOSSIBLE.has(pts)) return showFlash(b, pts + '?<br><small>onmogelijke score<\/small>');\n\n  const p = s.turn;\n  const before = s.rem[p];\n  const snapshot = JSON.stringify({ rem: s.rem, tot: s.tot, cnt: s.cnt, last: s.last, turn: s.turn, legs: s.legs, starter: s.starter, winner: s.winner });\n  s.hist.push(snapshot);\n  if (s.hist.length > 200) s.hist.shift();\n\n  s.cnt[p]++;\n  if (pts > before) {               // overgooid: beurt telt als 0\n    s.last[p] = 0;\n    showFlash(b, 'Overgooid!');\n    s.turn = 1 - p;\n  } else if (pts === before) {      // uitgegooid\n    s.tot[p] += pts; s.last[p] = pts;\n    s.legs[p]++;\n    if (s.legs[p] >= firstTo(s)) {\n      s.winner = p; s.rem[p] = 0;\n      showFlash(b, esc(teamName(s.teams[p])) + '<br>wint de wedstrijd!', 5000);\n    } else {\n      showFlash(b, esc(teamName(s.teams[p])) + '<br>wint de leg!', 2500);\n      s.starter = 1 - s.starter;\n      s.turn = s.starter;\n      s.rem = [s.start, s.start];\n      s.last = [null, null];\n    }\n  } else {\n    s.tot[p] += pts; s.last[p] = pts; s.rem[p] = before - pts;\n    if (pts === 180) showFlash(b, '180!');\n    s.turn = 1 - p;\n  }\n  render(b); save();\n}\n\nfunction undo(b) {\n  const s = b.state;\n  const prev = s.hist.pop();\n  if (!prev) return;\n  Object.assign(s, JSON.parse(prev));\n  render(b); save();\n}\n\nfunction render(b) {\n  const s = b.state;\n  b.el.querySelectorAll('.player').forEach(pe => {\n    const i = +pe.dataset.p;\n    pe.classList.toggle('active', s.winner === null && s.turn === i);\n    pe.classList.toggle('won', s.winner === i);\n    const sel = pe.querySelector('.name');\n    if (![...sel.options].some(o => o.value === s.teams[i])) {     // team bestaat niet meer in het klassement\n      const o = document.createElement('option'); o.value = s.teams[i]; o.textContent = teamName(s.teams[i]); sel.appendChild(o);\n    }\n    sel.value = s.teams[i];\n    pe.querySelector('.rem').textContent = s.rem[i];\n    pe.querySelector('.legs').textContent = s.legs[i];\n    pe.querySelector('.avg').textContent = s.cnt[i] ? (s.tot[i] / s.cnt[i]).toFixed(1) : '\u2013';\n    pe.querySelector('.last').textContent = s.last[i] === null ? '\u2013' : s.last[i];\n    pe.querySelector('.co').textContent = s.winner === null && s.rem[i] <= 180 ? ('Uit: ' + checkout(s.rem[i])) : '';\n  });\n  b.el.querySelector('.fmt-l').textContent = s.start + ' \u00b7 Best of ' + s.bestOf;\n  b.el.querySelector('.fmt-r').textContent = s.winner !== null ? teamName(s.teams[s.winner]) + ' wint' : 'Leg ' + (s.legs[0] + s.legs[1] + 1);\n  b.el.querySelector('.bestof').value = s.bestOf;\n  b.el.querySelector('.start').value = s.start;\n}\nfunction esc(t) { return String(t).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c])); }\n\nlet flashTimer = {};\nfunction showFlash(b, html, ms) {\n  b.flash.innerHTML = html;\n  b.flash.classList.add('show');\n  clearTimeout(flashTimer[b.idx]);\n  flashTimer[b.idx] = setTimeout(() => b.flash.classList.remove('show'), ms || 1400);\n}\n\n/* ---------- Camera's ---------- */\nasync function startCam(b, deviceId) {\n  if (b.stream) b.stream.getTracks().forEach(t => t.stop());\n  try {\n    b.stream = await navigator.mediaDevices.getUserMedia({\n      video: { deviceId: deviceId ? { exact: deviceId } : undefined, width: { ideal: 1920 }, height: { ideal: 1080 } },\n      audio: false\n    });\n    b.video.srcObject = b.stream;\n    b.msg.style.display = 'none';\n    try { localStorage.setItem('darts-cam2-' + b.idx, b.stream.getVideoTracks()[0].getSettings().deviceId || ''); } catch (e) {}\n  } catch (e) {\n    b.msg.style.display = 'flex';\n    b.msg.textContent = 'Kan deze camera niet openen (' + e.message + '). Kies een andere camera in het menu bovenin.';\n  }\n  await refreshCams();\n}\n\nlet cams = [];\nasync function refreshCams() {\n  try { cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput'); } catch (e) {}\n  fillSelects();\n}\n// Nieuwe camera aangesloten of Iriun opnieuw gestart: lijst bijwerken\nif (navigator.mediaDevices) navigator.mediaDevices.addEventListener('devicechange', refreshCams);\n\nfunction curId(b) {\n  const t = b.stream && b.stream.getVideoTracks()[0];\n  return t ? t.getSettings().deviceId : '';\n}\n\nfunction fillSelects() {\n  boards.forEach(b => {\n    const cur = b.stream && b.stream.getVideoTracks()[0] ? b.stream.getVideoTracks()[0].getSettings().deviceId : '';\n    b.sel.innerHTML = '';\n    cams.forEach((d, i) => {\n      const o = document.createElement('option');\n      o.value = d.deviceId; o.textContent = d.label || ('Camera ' + (i+1));\n      if (d.deviceId === cur) o.selected = true;\n      b.sel.appendChild(o);\n    });\n  });\n  // Waarschuwen als beide borden op dezelfde camera staan\n  const same = boards.length === 2 && curId(boards[0]) && curId(boards[0]) === curId(boards[1]);\n  boards.forEach(b => { b.el.querySelector('.warn').style.display = same && cams.length > 1 ? 'block' : 'none'; });\n  if (same && cams.length > 1) showControls();\n}\n\nasync function init() {\n  makeBoard(0); makeBoard(1);\n  try {\n    // Eerst \u00e9\u00e9n keer toestemming vragen zodat de cameranamen zichtbaar worden\n    // Camera's opvragen terwijl de toestemming nog actief is, anders geeft Chrome soms maar \u00e9\u00e9n naamloze camera terug\n    const tmp = await navigator.mediaDevices.getUserMedia({ video: true });\n    cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');\n    tmp.getTracks().forEach(t => t.stop());\n  } catch (e) {\n    boards.forEach(b => { b.msg.textContent = 'Geef Chrome toestemming voor de camera en ververs de pagina.'; });\n    return;\n  }\n  // Voorkeur: Iriun eerst, dan overige camera's, ingebouwde webcam daarna, Camo als laatste\n  const rank = d => /iriun/i.test(d.label) ? 0 : /camo/i.test(d.label) ? 3 : /integrated|ingebouwd|hd webcam|front/i.test(d.label) ? 2 : 1;\n  const sorted = cams.slice().sort((a, b) => rank(a) - rank(b));\n  // Eerder gekozen camera per bord onthouden, anders de eerste twee telefooncamera's\n  const remembered = i => { try { const id = localStorage.getItem('darts-cam2-' + i); return cams.some(c => c.deviceId === id) ? id : null; } catch (e) { return null; } };\n  const pick0 = remembered(0) || (sorted[0] && sorted[0].deviceId);\n  const pick1 = remembered(1) || (sorted.find(c => c.deviceId !== pick0) || sorted[0] || {}).deviceId;\n  await startCam(boards[0], pick0);\n  await startCam(boards[1], pick1);\n  boards[0].input.focus();\n}\n\n// Bediening bovenin verbergen als de muis stilstaat\nlet hideT;\nfunction showControls() {\n  const help = document.getElementById('help');\n  if (help) { help.classList.remove('hidden'); }\n  if (document.body.classList.contains('tv')) return;\n  document.querySelectorAll('.controls, #nav').forEach(c => c.classList.remove('hidden'));\n  clearTimeout(hideT);\n  hideT = setTimeout(() => {\n    document.querySelectorAll('.controls, #nav').forEach(c => c.classList.add('hidden'));\n    const help = document.getElementById('help'); if (help) help.classList.add('hidden');\n  }, 3000);\n}\ndocument.addEventListener('mousemove', showControls);\nshowControls();\n\n/* ---------- Sneltoetsen ---------- */\nfunction tvMsg(t) {\n  const m = document.getElementById('tvmsg');\n  m.textContent = t; m.classList.add('show');\n  clearTimeout(tvMsg.t); tvMsg.t = setTimeout(() => m.classList.remove('show'), 1600);\n}\nfunction setTv(on) {\n  document.body.classList.toggle('tv', on);\n  try { localStorage.setItem('darts-tv', on ? '1' : '0'); } catch (e) {}\n  if (on) { document.querySelectorAll('.controls, #nav').forEach(c => c.classList.add('hidden')); tvMsg('TV-modus aan \u00b7 druk H om bediening te tonen'); }\n  else { showControls(); tvMsg('TV-modus uit'); }\n}\ntry { if (localStorage.getItem('darts-tv') === '1') document.body.classList.add('tv'); } catch (e) {}\n\n// Bord waar je mee bezig bent: dat van het actieve invoerveld, anders bord 1\nconst activeBoard = () => boards.find(b => document.activeElement === b.input) || boards[0];\n\ndocument.addEventListener('keydown', e => {\n  // Niet ingrijpen tijdens het bewerken van een spelersnaam\n  if (document.activeElement && (document.activeElement.isContentEditable || document.activeElement.tagName === 'SELECT')) return;\n  if (e.ctrlKey || e.altKey || e.metaKey) {\n    if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(activeBoard()); }\n    return;\n  }\n  const k = e.key.toLowerCase();\n  if (e.key === 'Tab' && boards.length === 2) {\n    e.preventDefault();\n    const i = document.activeElement === boards[0].input ? 1 : 0;\n    boards[i].input.focus();\n  } else if (k === 'h') { e.preventDefault(); setTv(!document.body.classList.contains('tv')); }\n  else if (k === 'f') {\n    e.preventDefault();\n    toggleFs();\n  }\n  else if (k === 'r') { e.preventDefault(); activeBoard().zoom.reset(); }\n  else if (k === 'u') { e.preventDefault(); undo(activeBoard()); }\n  else if (e.key === '+' || e.key === '=') { e.preventDefault(); activeBoard().zoom.step(1.25); }\n  else if (e.key === '-') { e.preventDefault(); activeBoard().zoom.step(0.8); }\n  else if (e.key.startsWith('Arrow') && activeBoard().zoom.zoomed()) {\n    e.preventDefault();\n    const d = 0.04;\n    activeBoard().zoom.pan(e.key === 'ArrowLeft' ? d : e.key === 'ArrowRight' ? -d : 0, e.key === 'ArrowUp' ? d : e.key === 'ArrowDown' ? -d : 0);\n  }\n});\n\ninit();\n<\/script>\n<\/body>\n<\/html>\n", "klassement.html": "<!doctype html>\n<html lang=\"nl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Darts Klassement<\/title>\n<style>\n  :root { --green: #0d4a2b; --green-2: #146b3e; --red: #c8102e; --red-2: #e3263f; --cream: #f2e6c9; --panel: rgba(9,46,27,.92); --muted: #b9cdbf; --bg: #04170d; }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; min-height: 100%; background: var(--bg); color: #fff; font-family: system-ui, \"Segoe UI\", sans-serif; }\n  body { background: radial-gradient(ellipse at top, #0b3a22 0%, var(--bg) 70%); min-height: 100vh; }\n\n  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 24px; border-bottom: 4px solid var(--red); background: var(--green); }\n  h1 { margin: 0; font-size: clamp(22px, 2.6vw, 44px); letter-spacing: .5px; }\n  h1 input { font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 2px dashed transparent; width: 100%; min-width: 200px; }\n  h1 input:focus { outline: none; border-bottom-color: var(--cream); }\n  .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--cream); }\n  .tools a, .tools button, .tools input { font-size: 13px; padding: 4px 9px; border-radius: 4px; border: 1px solid var(--cream); background: var(--green-2); color: #fff; text-decoration: none; cursor: pointer; }\n  .tools input { width: 54px; cursor: text; background: var(--bg); }\n  .tools .red, .tools a.cur { background: var(--red); }\n  .sep { width: 1px; height: 22px; background: rgba(242,230,201,.35); margin: 0 4px; }\n\n  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 30vw); gap: 24px; padding: 24px; align-items: start; }\n  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }\n  .card { background: var(--panel); border: 2px solid var(--cream); border-radius: 12px; overflow: hidden; }\n  .card h2 { margin: 0; background: var(--red); padding: 8px 16px; font-size: clamp(14px, 1.3vw, 22px); text-transform: uppercase; letter-spacing: 1px; }\n  .scroll { overflow-x: auto; }\n\n  table { border-collapse: collapse; width: 100%; font-size: clamp(13px, 1.1vw, 19px); }\n  th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid rgba(242,230,201,.15); white-space: nowrap; }\n  th { color: var(--cream); font-size: .8em; text-transform: uppercase; letter-spacing: .5px; vertical-align: bottom; }\n  th.mini { color: #ffb3bd; }\n  th input { font: inherit; color: inherit; text-transform: uppercase; letter-spacing: inherit; text-align: center; background: transparent; border: 0; border-bottom: 1px dashed rgba(242,230,201,.4); width: 100%; min-width: 80px; }\n  th input:focus { outline: none; border-bottom-color: var(--cream); }\n  th .kind { display: block; font-size: .8em; opacity: .7; text-transform: none; letter-spacing: 0; }\n  td.team { text-align: left; font-weight: 700; }\n  td.team input { font: inherit; color: #fff; background: transparent; border: 0; border-bottom: 1px dashed rgba(242,230,201,.4); width: 100%; min-width: 120px; }\n  td.team input:focus { outline: none; border-bottom-color: var(--cream); }\n  td.cell input { width: 4.2em; text-align: center; font: inherit; font-variant-numeric: tabular-nums; color: #fff; background: rgba(0,0,0,.28); border: 1px solid var(--green-2); border-radius: 5px; padding: 3px; }\n  td.cell input:focus { outline: none; border-color: var(--red-2); background: rgba(200,16,46,.2); }\n  td.cell input.bad { border-color: var(--red-2); color: #ffb3bd; }\n  td.total { font-weight: 900; font-size: 1.2em; color: var(--cream); font-variant-numeric: tabular-nums; }\n  .x { background: transparent; color: var(--muted); border: 0; cursor: pointer; font-size: 1em; padding: 0 4px; }\n  .x:hover { color: var(--red-2); }\n\n  .rank { list-style: none; margin: 0; padding: 8px; }\n  .rank li { display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; margin: 4px 0; font-size: clamp(16px, 1.6vw, 28px); background: rgba(0,0,0,.2); transition: transform .3s; }\n  .rank li.final { background: var(--red); border: 2px solid var(--cream); }\n  .rank .pos { font-weight: 900; color: var(--cream); text-align: center; }\n  .rank .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  .rank .pt { font-weight: 900; font-variant-numeric: tabular-nums; }\n  .rank .pt small { font-size: .55em; font-weight: 500; opacity: .8; }\n  .note { padding: 6px 16px 14px; font-size: 13px; color: var(--muted); }\n  .note b { color: var(--cream); }\n  #finalBtn { margin: 0 16px 16px; width: calc(100% - 32px); font-size: 15px; font-weight: 700; padding: 10px; border-radius: 8px; border: 2px solid var(--cream); background: var(--red); color: #fff; cursor: pointer; }\n  #finalBtn:hover { background: var(--red-2); }\n\n  .leftcol { display: flex; flex-direction: column; gap: 24px; min-width: 0; }\n  #rules { display: block; width: calc(100% - 32px); margin: 14px 16px; min-height: 120px; resize: vertical; font: inherit; font-size: clamp(14px, 1.1vw, 19px); line-height: 1.5; color: #fff; background: rgba(0,0,0,.28); border: 1px solid var(--green-2); border-radius: 8px; padding: 10px 12px; }\n  #rules:focus { outline: none; border-color: var(--red-2); }\n  #rules::placeholder { color: rgba(185,205,191,.55); }\n  #rulesView { display: none; margin: 0; padding: 12px 16px 16px 40px; font-size: clamp(16px, 1.5vw, 28px); line-height: 1.45; }\n  #rulesView li { margin: 4px 0; }\n  #rulesView li::marker { color: var(--red-2); }\n  body.tv #rulesView { display: block; }\n  body.tv #rulesCard.empty { display: none; }\n\n  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }\n  @media (max-width: 1100px) { .duo { grid-template-columns: 1fr; } }\n  #schemaBox { padding: 14px 16px; }\n  #schemaImg { display: none; width: 100%; height: auto; border-radius: 6px; cursor: zoom-in; background: #fff; }\n  #schemaCard.has #schemaImg { display: block; }\n  #schemaCard.has #schemaDrop { display: none; }\n  #schemaDrop { display: block; border: 2px dashed rgba(242,230,201,.5); border-radius: 10px; padding: 34px 16px; text-align: center; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1.6; }\n  #schemaDrop b { color: var(--cream); font-size: 16px; }\n  #schemaDrop.over, #schemaDrop:hover { border-color: var(--red-2); background: rgba(200,16,46,.12); }\n  .schema-tools { display: none; gap: 6px; padding: 0 16px 14px; }\n  #schemaCard.has .schema-tools { display: flex; }\n  .schema-tools button { font-size: 13px; padding: 4px 9px; border-radius: 4px; border: 1px solid var(--cream); background: var(--green-2); color: #fff; cursor: pointer; }\n  .schema-msg { color: #ffb3bd; font-size: 13px; padding: 0 16px 12px; }\n  #zoomView { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.88); align-items: center; justify-content: center; padding: 2vw; cursor: zoom-out; }\n  #zoomView.show { display: flex; }\n  #zoomView img { max-width: 100%; max-height: 100%; border-radius: 6px; background: #fff; }\n  body.tv #schemaCard:not(.has) { display: none; }\n  body.tv .duo:has(#rulesCard.empty) { grid-template-columns: 1fr; }\n\n  /* TV-modus: alleen bekijken */\n  body.tv .tools, body.tv .x, body.tv #finalBtn, body.tv .edit-only { display: none !important; }\n  body.tv input { pointer-events: none; border-color: transparent !important; background: transparent !important; }\n  body.tv, body.tv * { cursor: none !important; }\n  body.tv main { grid-template-columns: minmax(0, 1fr) minmax(320px, 34vw); }\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1><input id=\"title\" maxlength=\"60\" aria-label=\"Naam van het toernooi\"><\/h1>\n  <div class=\"tools\">\n    <a href=\"een-bord.html\">1 bord<\/a><a href=\"twee-borden.html\">2 borden<\/a><a class=\"cur\" href=\"klassement.html\">Klassement<\/a>\n    <span class=\"sep\"><\/span>\n    <label>Teams <input type=\"number\" id=\"nTeams\" min=\"2\" max=\"16\"><\/label>\n    <button id=\"addDarts\">+ Dartronde<\/button>\n    <button id=\"addMini\">+ Minigame<\/button>\n    <span class=\"sep\"><\/span>\n    <button id=\"reset\" class=\"red\">Alles wissen<\/button>\n    <button id=\"tvBtn\" title=\"Alleen bekijken (H)\">TV-modus<\/button>\n  <\/div>\n<\/header>\n\n<main>\n  <div class=\"leftcol\">\n  <section class=\"card\">\n    <h2>Punten per onderdeel<\/h2>\n    <div class=\"scroll\"><table id=\"tbl\"><\/table><\/div>\n    <div class=\"note edit-only\">Typ per team de punten in. Optellen mag direct in het vakje, bijv. <b>3+1<\/b> als een team twee wedstrijden in \u00e9\u00e9n ronde speelt. Klik op een kolom- of teamnaam om die te wijzigen.<\/div>\n  <\/section>\n  <div class=\"duo\">\n  <section class=\"card\" id=\"rulesCard\">\n    <h2>Regels<\/h2>\n    <textarea id=\"rules\" class=\"edit-only\" rows=\"6\" placeholder=\"Typ hier de regels, \u00e9\u00e9n regel per lijn. Bijvoorbeeld:&#10;180 gegooid? Het andere team drinkt.&#10;Overgooid = slok.&#10;Bull geraakt? Kies iemand die een shot neemt.\"><\/textarea>\n    <ul id=\"rulesView\"><\/ul>\n  <\/section>\n  <section class=\"card\" id=\"schemaCard\">\n    <h2>Speelschema<\/h2>\n    <div id=\"schemaBox\">\n      <img id=\"schemaImg\" alt=\"Speelschema\" title=\"Klik om te vergroten\">\n      <label id=\"schemaDrop\" class=\"edit-only\">\n        <input type=\"file\" id=\"schemaFile\" accept=\"image/*\" hidden>\n        <b>Afbeelding kiezen<\/b><br>of hierheen slepen, of plakken met Ctrl+V\n      <\/label>\n    <\/div>\n    <div class=\"schema-tools edit-only\">\n      <button id=\"schemaChange\">Andere afbeelding<\/button>\n      <button id=\"schemaRemove\">Verwijderen<\/button>\n    <\/div>\n  <\/section>\n  <\/div>\n  <\/div>\n  <section class=\"card\">\n    <h2>Stand<\/h2>\n    <ol class=\"rank\" id=\"rank\"><\/ol>\n    <div class=\"note\">De nummers <b>1 en 2<\/b> spelen de finale. De teamnamen hier verschijnen in de keuzemenu's bij 1 bord en 2 borden.<\/div>\n    <button id=\"finalBtn\">Finale starten op 1 bord \u25b6<\/button>\n  <\/section>\n<\/main>\n\n<div id=\"zoomView\" title=\"Klik om te sluiten\"><img id=\"zoomImg\" alt=\"Speelschema\"><\/div>\n\n<script>\n// --- Navigatie en volledig scherm: werkt los \u00e9n binnen het gecombineerde bestand ---\nconst inShell = typeof window.dartsShow === 'function';\nfunction goPage(p) { if (inShell) window.dartsShow(p); else location.href = p; }\nfunction toggleFs() {\n  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});\n}\ndocument.addEventListener('click', e => {\n  const a = e.target.closest && e.target.closest('a[href$=\".html\"]');\n  if (a && inShell) { e.preventDefault(); goPage(a.getAttribute('href')); }\n});\n\nconst KEY = 'darts-toernooi-v1';\nconst $ = id => document.getElementById(id);\nconst store = {\n  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },\n  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n};\nlet uid = Date.now();\nconst id = () => (uid++).toString(36);\n\nfunction defaults() {\n  // vaste id's, gelijk aan die van de wedstrijdpagina's\n  const cols = []; let n = 0;\n  for (let r = 1; r <= 4; r++) {\n    cols.push({ id: 'c' + (++n), name: 'Ronde ' + r, kind: 'darts' });\n    if (r < 4) cols.push({ id: 'c' + (++n), name: 'Minigame ' + r, kind: 'mini' });\n  }\n  return {\n    title: 'Darttoernooi',\n    teams: [1, 2, 3, 4, 5].map(i => ({ id: 't' + i, name: 'Team ' + i })),\n    cols, cells: {}\n  };\n}\nlet T = store.get(KEY) || defaults();\nconst save = () => store.set(KEY, T);\n\n// \"3+1\" of \"2 + 2 - 1\" \u2192 getal; leeg \u2192 0; ongeldig \u2192 null\nfunction val(str) {\n  const s = String(str || '').replace(/\\s/g, '').replace(',', '.');\n  if (s === '') return 0;\n  if (!/^[+-]?\\d+(\\.\\d+)?([+-]\\d+(\\.\\d+)?)*$/.test(s)) return null;\n  return s.match(/[+-]?\\d+(\\.\\d+)?/g).reduce((a, b) => a + parseFloat(b), 0);\n}\nconst fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);\nconst total = t => T.cols.reduce((sum, c) => sum + (val(T.cells[t.id + '|' + c.id]) || 0), 0);\nconst esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\nfunction buildTable() {\n  let h = '<thead><tr><th style=\"text-align:left\">Team<\/th>';\n  T.cols.forEach(c => {\n    h += '<th class=\"' + c.kind + '\"><input data-col=\"' + c.id + '\" value=\"' + esc(c.name) + '\">' +\n      '<span class=\"kind\">' + (c.kind === 'darts' ? 'darts' : 'minigame') + ' <button class=\"x\" data-delcol=\"' + c.id + '\" title=\"Kolom verwijderen\">\u00d7<\/button><\/span><\/th>';\n  });\n  h += '<th>Totaal<\/th><\/tr><\/thead><tbody>';\n  T.teams.forEach(t => {\n    h += '<tr><td class=\"team\"><input data-team=\"' + t.id + '\" value=\"' + esc(t.name) + '\"><\/td>';\n    T.cols.forEach(c => {\n      const v = T.cells[t.id + '|' + c.id] || '';\n      h += '<td class=\"cell\"><input inputmode=\"decimal\" data-cell=\"' + t.id + '|' + c.id + '\" value=\"' + esc(v) + '\"' + (val(v) === null ? ' class=\"bad\"' : '') + '><\/td>';\n    });\n    h += '<td class=\"total\" data-total=\"' + t.id + '\"><\/td><\/tr>';\n  });\n  $('tbl').innerHTML = h + '<\/tbody>';\n  updateTotals();\n}\n\nfunction ranking() {\n  const list = T.teams.map(t => ({ t, pts: total(t) })).sort((a, b) => b.pts - a.pts);\n  let pos = 0;\n  list.forEach((x, i) => { if (i === 0 || x.pts !== list[i - 1].pts) pos = i + 1; x.pos = pos; });\n  return list;\n}\n\nfunction updateTotals() {\n  T.teams.forEach(t => { const td = document.querySelector('[data-total=\"' + t.id + '\"]'); if (td) td.textContent = fmt(total(t)); });\n  const list = ranking();\n  $('rank').innerHTML = list.map(x =>\n    '<li class=\"' + (x.pos <= 2 && x.pts > 0 && list[list.length - 1].pts !== list[0].pts ? 'final' : '') + '\"><span class=\"pos\">' + x.pos + '<\/span><span class=\"nm\">' + esc(x.t.name) +\n    '<\/span><span class=\"pt\">' + fmt(x.pts) + ' <small>pt<\/small><\/span><\/li>').join('');\n  $('nTeams').value = T.teams.length;\n  $('title').value = T.title;\n  document.title = T.title + ' \u2013 Klassement';\n}\n\n// Invoer\n$('tbl').addEventListener('input', e => {\n  const el = e.target;\n  if (el.dataset.cell) { T.cells[el.dataset.cell] = el.value; el.classList.toggle('bad', val(el.value) === null); }\n  else if (el.dataset.team) { const t = T.teams.find(x => x.id === el.dataset.team); t.name = el.value.trim() || 'Team'; }\n  else if (el.dataset.col) { const c = T.cols.find(x => x.id === el.dataset.col); c.name = el.value.trim() || 'Onderdeel'; }\n  updateTotals(); save();\n});\n// Enter = naar het vakje eronder\n$('tbl').addEventListener('keydown', e => {\n  if (e.key !== 'Enter' || !e.target.dataset.cell) return;\n  e.preventDefault();\n  const cells = [...document.querySelectorAll('[data-cell]')];\n  const cols = T.cols.length, i = cells.indexOf(e.target);\n  const next = cells[i + cols] || cells[(i % cols) + 1];\n  if (next) { next.focus(); next.select(); }\n});\n$('tbl').addEventListener('click', e => {\n  const del = e.target.dataset.delcol;\n  if (!del) return;\n  const c = T.cols.find(x => x.id === del);\n  if (!confirm('Kolom \"' + c.name + '\" met alle punten verwijderen?')) return;\n  T.cols = T.cols.filter(x => x.id !== del);\n  Object.keys(T.cells).forEach(k => { if (k.endsWith('|' + del)) delete T.cells[k]; });\n  buildTable(); save();\n});\n\n$('title').addEventListener('input', () => { T.title = $('title').value || 'Darttoernooi'; document.title = T.title + ' \u2013 Klassement'; save(); });\n$('nTeams').addEventListener('change', () => {\n  const n = Math.max(2, Math.min(16, parseInt($('nTeams').value, 10) || T.teams.length));\n  if (n < T.teams.length) {\n    const gone = T.teams.slice(n);\n    if (!confirm('Team(s) ' + gone.map(t => t.name).join(', ') + ' met hun punten verwijderen?')) { $('nTeams').value = T.teams.length; return; }\n    gone.forEach(t => Object.keys(T.cells).forEach(k => { if (k.startsWith(t.id + '|')) delete T.cells[k]; }));\n    T.teams = T.teams.slice(0, n);\n  }\n  while (T.teams.length < n) T.teams.push({ id: id(), name: 'Team ' + (T.teams.length + 1) });\n  buildTable(); save();\n});\nfunction addCol(kind) {\n  const n = T.cols.filter(c => c.kind === kind).length + 1;\n  T.cols.push({ id: id(), name: (kind === 'darts' ? 'Ronde ' : 'Minigame ') + n, kind });\n  buildTable(); save();\n}\n$('addDarts').onclick = () => addCol('darts');\n$('addMini').onclick = () => addCol('mini');\n$('reset').onclick = () => {\n  if (!confirm('Alle punten wissen? Teamnamen en kolommen blijven staan.')) return;\n  T.cells = {}; buildTable(); save();\n};\n\n// Finale: de beste twee naar de 1-bordpagina sturen\n$('finalBtn').onclick = () => {\n  const list = ranking();\n  if (list.length < 2) return;\n  if (list.length > 2 && list[2].pts === list[1].pts) {\n    alert('Gelijke stand om de tweede plek (' + list.filter(x => x.pts === list[1].pts).map(x => x.t.name).join(', ') + '). Beslis eerst wie de finale speelt, bijvoorbeeld met een bull-off, en geef dat team een bonuspunt.');\n    return;\n  }\n  const a = list[0].t, b = list[1].t;\n  if (!confirm('Finale starten: ' + a.name + ' vs ' + b.name + '?\\nDe huidige stand op de 1-bordpagina wordt vervangen. Best of en startscore stel je daar in.')) return;\n  const old = store.get('darts-match-v1') || {};\n  const bestOf = old.bestOf || 5, start = old.start || 301;\n  store.set('darts-match-v1', {\n    teams: [a.id, b.id], bestOf, start, legs: [0, 0], starter: 0, turn: 0,\n    rem: [start, start], tot: [0, 0], cnt: [0, 0], last: [null, null], winner: null, hist: []\n  });\n  goPage('een-bord.html');\n};\n\n// Regels (vrij tekstvak, wordt in TV-modus als lijst getoond)\nfunction renderRules() {\n  const lines = (T.rules || '').split('\\n').map(l => l.trim()).filter(Boolean);\n  $('rulesView').innerHTML = lines.map(l => '<li>' + esc(l.replace(/^[-*\u2022]\\s*/, '')) + '<\/li>').join('');\n  $('rulesCard').classList.toggle('empty', !lines.length);\n}\n$('rules').value = T.rules || '';\n$('rules').addEventListener('input', () => { T.rules = $('rules').value; renderRules(); save(); });\nrenderRules();\n\n// Speelschema als afbeelding (verkleind en opgeslagen in de browser)\nconst SCHEMA_KEY = 'darts-schema-img';\nfunction showSchema(url) {\n  $('schemaImg').src = url || '';\n  $('schemaCard').classList.toggle('has', !!url);\n  const m = document.querySelector('.schema-msg'); if (m) m.remove();\n}\nfunction schemaError(t) {\n  showSchema(localStorage.getItem(SCHEMA_KEY));\n  const d = document.createElement('div'); d.className = 'schema-msg'; d.textContent = t;\n  $('schemaCard').appendChild(d);\n}\nfunction loadSchemaFile(file) {\n  if (!file || !file.type.startsWith('image/')) return schemaError('Dat is geen afbeelding.');\n  const fr = new FileReader();\n  fr.onload = () => {\n    const img = new Image();\n    img.onload = () => {\n      // Verkleinen tot max. 2000 px en zo opslaan dat het in de browseropslag past\n      for (const [max, type, q] of [[2000, 'image/png'], [2000, 'image/jpeg', .9], [1600, 'image/jpeg', .85], [1200, 'image/jpeg', .8]]) {\n        const k = Math.min(1, max / Math.max(img.width, img.height));\n        const c = document.createElement('canvas');\n        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);\n        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);\n        const url = c.toDataURL(type, q);\n        if (url.length > 3500000) continue;\n        try { localStorage.setItem(SCHEMA_KEY, url); showSchema(url); return; } catch (e) {}\n      }\n      schemaError('De afbeelding is te groot om op te slaan. Probeer een kleinere of een screenshot.');\n    };\n    img.onerror = () => schemaError('Deze afbeelding kan niet worden geopend.');\n    img.src = fr.result;\n  };\n  fr.readAsDataURL(file);\n}\n$('schemaFile').addEventListener('change', e => { loadSchemaFile(e.target.files[0]); e.target.value = ''; });\n$('schemaChange').onclick = () => $('schemaFile').click();\n$('schemaRemove').onclick = () => {\n  if (!confirm('Speelschema verwijderen?')) return;\n  try { localStorage.removeItem(SCHEMA_KEY); } catch (e) {}\n  showSchema(null);\n};\nconst drop = $('schemaDrop');\n['dragenter', 'dragover'].forEach(t => $('schemaCard').addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));\n['dragleave', 'drop'].forEach(t => $('schemaCard').addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));\n$('schemaCard').addEventListener('drop', e => loadSchemaFile(e.dataTransfer.files[0]));\ndocument.addEventListener('paste', e => {\n  if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;\n  const item = [...(e.clipboardData || {}).items || []].find(i => i.type.startsWith('image/'));\n  if (item) { e.preventDefault(); loadSchemaFile(item.getAsFile()); }\n});\n$('schemaImg').onclick = () => { $('zoomImg').src = $('schemaImg').src; $('zoomView').classList.add('show'); };\n$('zoomView').onclick = () => $('zoomView').classList.remove('show');\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') $('zoomView').classList.remove('show'); });\ntry { showSchema(localStorage.getItem(SCHEMA_KEY)); } catch (e) {}\n\n// TV-modus\nfunction setTv(on) { document.body.classList.toggle('tv', on); store.set('darts-klassement-tv', on); if (on) document.activeElement.blur(); }\n$('tvBtn').onclick = () => setTv(true);\nif (store.get('darts-klassement-tv')) document.body.classList.add('tv');\ndocument.addEventListener('keydown', e => {\n  const a = document.activeElement;\n  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;\n  if (e.key === 'h' || e.key === 'H') setTv(!document.body.classList.contains('tv'));\n  if ((e.key === 's' || e.key === 'S') && $('schemaCard').classList.contains('has')) {\n    $('zoomView').classList.contains('show') ? $('zoomView').classList.remove('show') : $('schemaImg').click();\n  }\n  if (e.key === 'f' || e.key === 'F') toggleFs();\n});\n\nbuildTable();\n<\/script>\n<\/body>\n<\/html>\n"};
  var key = function (n) { return '#' + n.replace('.html', ''); };
