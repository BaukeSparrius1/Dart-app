<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darts – 2 borden</title>
<style>
  :root { --green: #0d4a2b; --green-2: #146b3e; --red: #c8102e; --red-2: #e3263f; --cream: #f2e6c9; --panel: rgba(9,46,27,.86); --muted: #b9cdbf; --accent: var(--red-2); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #04170d; color: #fff; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; }
  #wrap { display: flex; width: 100vw; height: 100vh; gap: 6px; background: var(--red); }
  .board { position: relative; flex: 1; overflow: hidden; background: #04170d; }
  /* TV-modus: geen bediening, geen muiscursor, alleen beeld en scores */
  body.tv .controls, body.tv .warn, body.tv .undo, body.tv #help { display: none !important; }
  body.tv, body.tv * { cursor: none !important; }
  body.tv .entry input { border-color: transparent; background: transparent; }
  body.tv .entry input::placeholder { color: transparent; }
  #help { position: fixed; top: 92px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--cream); background: var(--panel); padding: 3px 10px; border-radius: 4px; z-index: 5; transition: opacity .4s; white-space: nowrap; }
  #help.hidden { opacity: 0; }
  #nav { position: fixed; left: 12px; bottom: 12px; z-index: 6; display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--cream); border-radius: 8px; padding: 5px 8px; font-size: 13px; color: var(--cream); transition: opacity .4s; }
  #nav.hidden { opacity: 0; pointer-events: none; }
  #nav a { color: #fff; text-decoration: none; background: var(--green); border: 1px solid var(--cream); border-radius: 4px; padding: 3px 8px; }
  #nav a.cur { background: var(--red); }
  body.tv #nav { display: none !important; }
  #tvmsg { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--red); color: #fff; border: 2px solid var(--cream); padding: 10px 18px; border-radius: 8px; font-size: 18px; font-weight: 700; z-index: 10; opacity: 0; transition: opacity .3s; pointer-events: none; text-align: center; }
  #tvmsg.show { opacity: 1; }
  .zw { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
  .board.zoomed { cursor: grab; }
  .board.dragging { cursor: grabbing; }
  .zoomlbl { margin-left: 8px; font-size: .8em; color: var(--cream); }
  .board video { width: 100%; height: 100%; object-fit: contain; background: #04170d; display: block; }
  .board video.cover { object-fit: cover; }
  .board video.mirror { transform: scaleX(-1); }

  .title { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--red); border: 2px solid var(--cream); color: #fff; padding: 4px 14px; border-radius: 6px; font-weight: 700; letter-spacing: .5px; font-size: clamp(12px, 1.4vw, 20px); }

  .controls { position: absolute; top: 48px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; transition: opacity .4s; }
  .controls.hidden { opacity: 0; pointer-events: none; }
  .controls select, .controls button { font-size: 13px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--cream); background: var(--green); color: #fff; cursor: pointer; }
  .controls select { max-width: 240px; font-weight: 600; }
  .camlbl { display: flex; align-items: center; gap: 6px; background: var(--panel); color: var(--cream); padding: 2px 4px 2px 10px; border-radius: 6px; font-size: 13px; }
  .warn { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); background: var(--red); color: #fff; border: 2px solid var(--cream); padding: 6px 12px; border-radius: 6px; font-size: 13px; display: none; text-align: center; max-width: 90%; }

  .score { position: absolute; left: 50%; transform: translateX(-50%); width: min(50%, 420px); min-width: 260px; bottom: 8px; background: var(--panel); border-radius: 8px; padding: 6px; border-top: 4px solid var(--red); }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .player { border-radius: 6px; padding: 3px 7px; border: 2px solid transparent; position: relative; }
  .player.active { border-color: var(--cream); background: var(--red); }
  .player.active::before { content: "▶"; position: absolute; left: -1px; top: 3px; color: var(--cream); font-size: clamp(8px, 0.6vw, 11px); }
  .name { font-size: clamp(11px, 0.9vw, 15px); font-weight: 600; outline: none; padding-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  select.name { display: block; width: 100%; background: transparent; color: #fff; border: 1px dashed rgba(242,230,201,.45); border-radius: 4px; padding: 1px 4px 1px 8px; font-family: inherit; cursor: pointer; }
  select.name option { background: var(--green); color: #fff; }
  body.tv select.name { border-color: transparent; appearance: none; -webkit-appearance: none; pointer-events: none; }
  .fmt { display: flex; justify-content: space-between; font-size: clamp(9px, 0.65vw, 11px); color: var(--cream); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 0 4px 4px; }
  .player.won { border-color: var(--cream); background: var(--green-2); }
  .ctl-lbl { display: flex; align-items: center; gap: 4px; background: var(--panel); color: var(--cream); padding: 2px 4px 2px 8px; border-radius: 6px; font-size: 13px; }
  .rem { font-size: clamp(18px, 2.75vw, 48px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .stats { font-size: clamp(9px, 0.65vw, 11px); color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .stats b { color: #fff; }
  .player.active .stats { color: var(--cream); }
  .co { font-size: clamp(9px, 0.7vw, 12px); color: var(--cream); min-height: 1.3em; }

  .entry { display: flex; gap: 4px; margin-top: 5px; align-items: center; }
  .entry input { flex: 1; min-width: 0; font-size: clamp(12px, 0.9vw, 15px); padding: 3px 8px; border-radius: 6px; border: 2px solid var(--green-2); background: #062114; color: #fff; }
  .entry input:focus { border-color: var(--accent); outline: none; }
  .entry button { font-size: clamp(10px, 0.8vw, 13px); padding: 3px 8px; border-radius: 6px; border: 0; cursor: pointer; background: var(--red); color: #fff; font-weight: 600; }
  .entry button:hover { background: var(--red-2); }
  .flash { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%); font-size: clamp(28px, 5vw, 80px); font-weight: 900; color: var(--red-2); -webkit-text-stroke: 2px var(--cream); text-shadow: 0 0 24px #000; pointer-events: none; opacity: 0; transition: opacity .3s; text-align: center; }
  .flash.show { opacity: 1; }
  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--cream); text-align: center; padding: 24px; pointer-events: none; font-size: 14px; }
</style>
</head>
<body>
<div id="wrap"></div>
<div id="help">H = TV-modus (bediening verbergen) · F = volledig scherm · scrollen = zoomen · slepen = verschuiven · R = zoom reset · Tab = ander bord</div>
<div id="tvmsg"></div>
<nav id="nav"><a href="een-bord.html">1 bord</a><a class="cur" href="twee-borden.html">2 borden</a><a href="klassement.html">Klassement</a></nav>

<template id="tpl">
  <div class="board">
    <div class="zw"><video autoplay playsinline muted></video></div>
    <div class="msg">Camera wordt geopend…</div>
    <div class="title"></div>
    <div class="controls">
      <label class="camlbl">Camera: <select class="cam" title="Camera voor dit bord"></select></label>
      <button class="swap" title="Camera's van bord 1 en 2 omwisselen">⇄ Wissel</button>
      <button class="zin" title="Inzoomen (of scrollen met de muis)">＋</button>
      <button class="zout" title="Uitzoomen">－</button>
      <button class="zreset" title="Zoom herstellen (of dubbelklik op het beeld)">Zoom reset</button>
      <button class="fit">Vullen</button>
      <button class="mir">Spiegelen</button>
      <label class="ctl-lbl">Best of <select class="bestof"></select></label>
      <label class="ctl-lbl">Start <select class="start"><option>201</option><option>301</option><option>501</option></select></label>
      <button class="newgame">Nieuwe wedstrijd</button>
    </div>
    <div class="warn">Beide borden gebruiken dezelfde camera. Kies hierboven een andere.</div>
    <div class="flash"></div>
    <div class="score">
      <div class="fmt"><span class="fmt-l"></span><span class="fmt-r"></span></div>
      <div class="players">
        <div class="player" data-p="0">
          <select class="name" title="Team kiezen (namen stel je in bij Klassement)"></select>
          <div class="rem"></div>
          <div class="stats"><span>Legs <b class="legs"></b></span><span>Gem. <b class="avg"></b></span><span>Laatste <b class="last"></b></span></div>
          <div class="co"></div>
        </div>
        <div class="player" data-p="1">
          <select class="name" title="Team kiezen (namen stel je in bij Klassement)"></select>
          <div class="rem"></div>
          <div class="stats"><span>Legs <b class="legs"></b></span><span>Gem. <b class="avg"></b></span><span>Laatste <b class="last"></b></span></div>
          <div class="co"></div>
        </div>
      </div>
      <div class="entry">
        <input type="text" inputmode="numeric" placeholder="Score + Enter" maxlength="3">
        <button class="undo" title="Laatste beurt ongedaan maken">↶ Ongedaan</button>
      </div>
    </div>
  </div>
</template>

<script>
// --- Navigatie en volledig scherm: werkt los én binnen het gecombineerde bestand ---
const inShell = typeof window.dartsShow === 'function';
function goPage(p) { if (inShell) window.dartsShow(p); else location.href = p; }
function toggleFs() {
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
}
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href$=".html"]');
  if (a && inShell) { e.preventDefault(); goPage(a.getAttribute('href')); }
});

const IMPOSSIBLE = new Set([163,166,169,172,173,175,176,178,179]);
const STORE_KEY = 'darts301-v1';

/* ---------- Teams uit het klassement ---------- */
function loadTournament() {
  let T = null;
  try { T = JSON.parse(localStorage.getItem('darts-toernooi-v1')); } catch (e) {}
  if (!T || !Array.isArray(T.teams) || !T.teams.length) {
    const cols = []; let n = 0;
    for (let r = 1; r <= 4; r++) {
      cols.push({ id: 'c' + (++n), name: 'Ronde ' + r, kind: 'darts' });
      if (r < 4) cols.push({ id: 'c' + (++n), name: 'Minigame ' + r, kind: 'mini' });
    }
    T = { title: 'Darttoernooi', teams: [1, 2, 3, 4, 5].map(i => ({ id: 't' + i, name: 'Team ' + i })), cols, cells: {} };
    try { localStorage.setItem('darts-toernooi-v1', JSON.stringify(T)); } catch (e) {}
  }
  return T;
}
const TOURN = loadTournament();
const teamName = id => (TOURN.teams.find(t => t.id === id) || { name: '(team verwijderd)' }).name;
const teamIdByName = n => (TOURN.teams.find(t => t.name === n) || {}).id;
const BEST_OF = [1, 3, 5, 7, 9, 11];
const firstTo = s => Math.ceil(s.bestOf / 2);

/* ---------- Uitgooi-suggesties (single out: elke pijl mag de laatste zijn) ---------- */
const darts = [];
for (let i = 20; i >= 1; i--) darts.push({ v: 3*i, l: 'T'+i });
darts.push({ v: 50, l: 'Bull' });
darts.push({ v: 25, l: '25' });
for (let i = 20; i >= 1; i--) darts.push({ v: 2*i, l: 'D'+i });
for (let i = 20; i >= 1; i--) darts.push({ v: i, l: String(i) });
darts.sort((a, b) => b.v - a.v);
// Beste losse pijl per waarde: liefst enkel, dan 25/Bull, dan dubbel, dan triple
const single = {};
for (let i = 1; i <= 20; i++) { single[3*i] = 'T'+i; }
for (let i = 1; i <= 20; i++) { single[2*i] = 'D'+i; }
single[50] = 'Bull'; single[25] = '25';
for (let i = 1; i <= 20; i++) { single[i] = String(i); }

function checkout(r) {
  if (r <= 0 || r > 180) return '';
  if (single[r]) return single[r];
  for (const a of darts) if (a.v < r && single[r - a.v]) return a.l + ' ' + single[r - a.v];
  for (const a of darts) for (const b of darts) {
    const rest = r - a.v - b.v;
    if (rest > 0 && single[rest]) return a.l + ' ' + b.l + ' ' + single[rest];
  }
  return '';
}

/* ---------- Opslag (alleen gemak; werkt ook zonder) ---------- */
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ boards: boards.map(b => b.state) })); } catch (e) {}
}

/* ---------- Spelstatus ---------- */
function newMatch(teams, bestOf, start) {
  return { teams: teams, bestOf: bestOf || 3, start: start || 301, winner: null, legs: [0, 0], starter: 0, turn: 0, rem: [start || 301, start || 301], hist: [], tot: [0, 0], cnt: [0, 0], last: [null, null] };
}
// Oude opgeslagen standen (met losse namen) omzetten naar teams uit het klassement
function migrate(st, idx) {
  const def = [TOURN.teams[(idx * 2) % TOURN.teams.length].id, TOURN.teams[(idx * 2 + 1) % TOURN.teams.length].id];
  if (!st) return newMatch(def, 3, 301);
  if (!st.teams) st.teams = [0, 1].map(i => teamIdByName(st.names && st.names[i]) || def[i]);
  if (!st.bestOf) st.bestOf = 3;
  if (!st.start) st.start = 301;
  if (st.winner === undefined) st.winner = null;
  delete st.names;
  return st;
}

const saved = load();
const boards = [];

function makeBoard(idx) {
  const el = document.getElementById('tpl').content.firstElementChild.cloneNode(true);
  document.getElementById('wrap').appendChild(el);
  const b = {
    idx, el,
    video: el.querySelector('video'),
    sel: el.querySelector('.cam'),
    input: el.querySelector('input'),
    flash: el.querySelector('.flash'),
    msg: el.querySelector('.msg'),
    stream: null,
    state: migrate(saved.boards && saved.boards[idx], idx)
  };
  el.querySelector('.title').innerHTML = 'Bord ' + (idx + 1) + '<span class="zoomlbl"></span>';
  setupZoom(b);
  boards.push(b);

  // Teamkeuze (namen komen uit het klassement)
  el.querySelectorAll('.player').forEach(p => {
    const sel = p.querySelector('.name'), i = +p.dataset.p;
    TOURN.teams.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; sel.appendChild(o); });
    sel.addEventListener('change', () => { b.state.teams[i] = sel.value; render(b); save(); b.input.focus(); });
  });
  const bo = el.querySelector('.bestof');
  BEST_OF.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; bo.appendChild(o); });
  bo.addEventListener('change', () => {
    const s = b.state; s.bestOf = +bo.value;
    const w = [0, 1].find(i => s.legs[i] >= firstTo(s));
    s.winner = w === undefined ? null : w;
    render(b); save(); b.input.focus();
  });
  const stSel = el.querySelector('.start');
  stSel.addEventListener('change', () => {
    const s = b.state, v = +stSel.value;
    if (s.hist.length && !confirm('Startscore wijzigen naar ' + v + '? Dit start een nieuwe wedstrijd op bord ' + (idx + 1) + '.')) { stSel.value = s.start; return; }
    b.state = newMatch(s.teams.slice(), s.bestOf, v); render(b); save(); b.input.focus();
  });

  b.input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { submit(b, b.input.value.trim()); b.input.value = ''; }
    else if (e.key === 'Escape') { b.input.value = ''; }
  });
  el.querySelector('.undo').onclick = () => { undo(b); b.input.focus(); };
  el.querySelector('.newgame').onclick = () => {
    if (confirm('Nieuwe wedstrijd op bord ' + (idx+1) + '? De huidige stand gaat verloren.')) {
      b.state = newMatch(b.state.teams.slice(), b.state.bestOf, b.state.start); render(b); save();
    }
  };
  el.querySelector('.fit').onclick = () => b.video.classList.toggle('cover');
  el.querySelector('.mir').onclick = () => b.video.classList.toggle('mirror');
  b.sel.onchange = () => startCam(b, b.sel.value);
  el.querySelector('.swap').onclick = async () => {
    const ids = boards.map(x => curId(x));
    await startCam(boards[0], ids[1]);
    await startCam(boards[1], ids[0]);
  };

  render(b);
  return b;
}

/* ---------- Zoomen en verschuiven per beeld ---------- */
// Scrollen = zoomen naar de muispositie, slepen = verschuiven, dubbelklik = herstellen
function setupZoom(b) {
  const el = b.el, zw = el.querySelector('.zw');
  let z = { s: 1, x: 0, y: 0 };           // x/y als fractie van de beeldbreedte/-hoogte
  try { const sv = JSON.parse(localStorage.getItem('darts-zoom-' + b.idx)); if (sv && sv.s >= 1) z = sv; } catch (e) {}

  const onPanel = t => t.closest('.score, .controls, .title, .warn');
  function clamp() {
    z.s = Math.min(8, Math.max(1, z.s));
    z.x = Math.min(0, Math.max(1 - z.s, z.x));
    z.y = Math.min(0, Math.max(1 - z.s, z.y));
  }
  function apply() {
    clamp();
    const w = el.clientWidth, h = el.clientHeight;
    zw.style.transform = 'translate(' + (z.x * w) + 'px,' + (z.y * h) + 'px) scale(' + z.s + ')';
    el.classList.toggle('zoomed', z.s > 1.001);
    el.querySelector('.zoomlbl').textContent = z.s > 1.001 ? '· ' + z.s.toFixed(1) + '×' : '';
    try { localStorage.setItem('darts-zoom-' + b.idx, JSON.stringify(z)); } catch (e) {}
  }
  // Zoom naar punt (fx, fy) als fractie van het beeld
  function zoomAt(factor, fx, fy) {
    const ns = Math.min(8, Math.max(1, z.s * factor));
    z.x = fx - (fx - z.x) * (ns / z.s);
    z.y = fy - (fy - z.y) * (ns / z.s);
    z.s = ns;
    apply();
  }
  b.zoom = {
    reset() { z = { s: 1, x: 0, y: 0 }; apply(); },
    step(f) { zoomAt(f, 0.5, 0.5); },
    zoomed() { return z.s > 1.001; },
    pan(dx, dy) { z.x += dx; z.y += dy; apply(); }
  };

  el.addEventListener('wheel', e => {
    if (onPanel(e.target)) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * 0.0015), (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  }, { passive: false });

  let drag = null;
  el.addEventListener('mousedown', e => {
    if (e.button !== 0 || onPanel(e.target) || z.s <= 1.001) return;
    e.preventDefault();
    drag = { x: e.clientX, y: e.clientY, zx: z.x, zy: z.y };
    el.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    z.x = drag.zx + (e.clientX - drag.x) / el.clientWidth;
    z.y = drag.zy + (e.clientY - drag.y) / el.clientHeight;
    apply();
  });
  window.addEventListener('mouseup', () => { if (drag) { drag = null; el.classList.remove('dragging'); } });
  el.addEventListener('dblclick', e => { if (!onPanel(e.target)) b.zoom.reset(); });

  el.querySelector('.zin').onclick = () => zoomAt(1.25, 0.5, 0.5);
  el.querySelector('.zout').onclick = () => zoomAt(0.8, 0.5, 0.5);
  el.querySelector('.zreset').onclick = () => b.zoom.reset();
  window.addEventListener('resize', apply);
  apply();
}

function submit(b, txt) {
  const s = b.state;
  if (txt === '') return;
  if (s.winner !== null) return showFlash(b, 'Wedstrijd voorbij<br><small>Kies Nieuwe wedstrijd</small>', 2000);
  if (!/^\d{1,3}$/.test(txt)) return showFlash(b, 'Ongeldig');
  const pts = parseInt(txt, 10);
  if (pts > 180 || IMPOSSIBLE.has(pts)) return showFlash(b, pts + '?<br><small>onmogelijke score</small>');

  const p = s.turn;
  const before = s.rem[p];
  const snapshot = JSON.stringify({ rem: s.rem, tot: s.tot, cnt: s.cnt, last: s.last, turn: s.turn, legs: s.legs, starter: s.starter, winner: s.winner });
  s.hist.push(snapshot);
  if (s.hist.length > 200) s.hist.shift();

  s.cnt[p]++;
  if (pts > before) {               // overgooid: beurt telt als 0
    s.last[p] = 0;
    showFlash(b, 'Overgooid!');
    s.turn = 1 - p;
  } else if (pts === before) {      // uitgegooid
    s.tot[p] += pts; s.last[p] = pts;
    s.legs[p]++;
    if (s.legs[p] >= firstTo(s)) {
      s.winner = p; s.rem[p] = 0;
      showFlash(b, esc(teamName(s.teams[p])) + '<br>wint de wedstrijd!', 5000);
    } else {
      showFlash(b, esc(teamName(s.teams[p])) + '<br>wint de leg!', 2500);
      s.starter = 1 - s.starter;
      s.turn = s.starter;
      s.rem = [s.start, s.start];
      s.last = [null, null];
    }
  } else {
    s.tot[p] += pts; s.last[p] = pts; s.rem[p] = before - pts;
    if (pts === 180) showFlash(b, '180!');
    s.turn = 1 - p;
  }
  render(b); save();
}

function undo(b) {
  const s = b.state;
  const prev = s.hist.pop();
  if (!prev) return;
  Object.assign(s, JSON.parse(prev));
  render(b); save();
}

function render(b) {
  const s = b.state;
  b.el.querySelectorAll('.player').forEach(pe => {
    const i = +pe.dataset.p;
    pe.classList.toggle('active', s.winner === null && s.turn === i);
    pe.classList.toggle('won', s.winner === i);
    const sel = pe.querySelector('.name');
    if (![...sel.options].some(o => o.value === s.teams[i])) {     // team bestaat niet meer in het klassement
      const o = document.createElement('option'); o.value = s.teams[i]; o.textContent = teamName(s.teams[i]); sel.appendChild(o);
    }
    sel.value = s.teams[i];
    pe.querySelector('.rem').textContent = s.rem[i];
    pe.querySelector('.legs').textContent = s.legs[i];
    pe.querySelector('.avg').textContent = s.cnt[i] ? (s.tot[i] / s.cnt[i]).toFixed(1) : '–';
    pe.querySelector('.last').textContent = s.last[i] === null ? '–' : s.last[i];
    pe.querySelector('.co').textContent = s.winner === null && s.rem[i] <= 180 ? ('Uit: ' + checkout(s.rem[i])) : '';
  });
  b.el.querySelector('.fmt-l').textContent = s.start + ' · Best of ' + s.bestOf;
  b.el.querySelector('.fmt-r').textContent = s.winner !== null ? teamName(s.teams[s.winner]) + ' wint' : 'Leg ' + (s.legs[0] + s.legs[1] + 1);
  b.el.querySelector('.bestof').value = s.bestOf;
  b.el.querySelector('.start').value = s.start;
}
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let flashTimer = {};
function showFlash(b, html, ms) {
  b.flash.innerHTML = html;
  b.flash.classList.add('show');
  clearTimeout(flashTimer[b.idx]);
  flashTimer[b.idx] = setTimeout(() => b.flash.classList.remove('show'), ms || 1400);
}

/* ---------- Camera's ---------- */
async function startCam(b, deviceId) {
  if (b.stream) b.stream.getTracks().forEach(t => t.stop());
  try {
    b.stream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: deviceId ? { exact: deviceId } : undefined, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    b.video.srcObject = b.stream;
    b.msg.style.display = 'none';
    try { localStorage.setItem('darts-cam2-' + b.idx, b.stream.getVideoTracks()[0].getSettings().deviceId || ''); } catch (e) {}
  } catch (e) {
    b.msg.style.display = 'flex';
    b.msg.textContent = 'Kan deze camera niet openen (' + e.message + '). Kies een andere camera in het menu bovenin.';
  }
  await refreshCams();
}

let cams = [];
async function refreshCams() {
  try { cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput'); } catch (e) {}
  fillSelects();
}
// Nieuwe camera aangesloten of Iriun opnieuw gestart: lijst bijwerken
if (navigator.mediaDevices) navigator.mediaDevices.addEventListener('devicechange', refreshCams);

function curId(b) {
  const t = b.stream && b.stream.getVideoTracks()[0];
  return t ? t.getSettings().deviceId : '';
}

function fillSelects() {
  boards.forEach(b => {
    const cur = b.stream && b.stream.getVideoTracks()[0] ? b.stream.getVideoTracks()[0].getSettings().deviceId : '';
    b.sel.innerHTML = '';
    cams.forEach((d, i) => {
      const o = document.createElement('option');
      o.value = d.deviceId; o.textContent = d.label || ('Camera ' + (i+1));
      if (d.deviceId === cur) o.selected = true;
      b.sel.appendChild(o);
    });
  });
  // Waarschuwen als beide borden op dezelfde camera staan
  const same = boards.length === 2 && curId(boards[0]) && curId(boards[0]) === curId(boards[1]);
  boards.forEach(b => { b.el.querySelector('.warn').style.display = same && cams.length > 1 ? 'block' : 'none'; });
  if (same && cams.length > 1) showControls();
}

async function init() {
  makeBoard(0); makeBoard(1);
  try {
    // Eerst één keer toestemming vragen zodat de cameranamen zichtbaar worden
    // Camera's opvragen terwijl de toestemming nog actief is, anders geeft Chrome soms maar één naamloze camera terug
    const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
    cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    tmp.getTracks().forEach(t => t.stop());
  } catch (e) {
    boards.forEach(b => { b.msg.textContent = 'Geef Chrome toestemming voor de camera en ververs de pagina.'; });
    return;
  }
  // Voorkeur: Iriun eerst, dan overige camera's, ingebouwde webcam daarna, Camo als laatste
  const rank = d => /iriun/i.test(d.label) ? 0 : /camo/i.test(d.label) ? 3 : /integrated|ingebouwd|hd webcam|front/i.test(d.label) ? 2 : 1;
  const sorted = cams.slice().sort((a, b) => rank(a) - rank(b));
  // Eerder gekozen camera per bord onthouden, anders de eerste twee telefooncamera's
  const remembered = i => { try { const id = localStorage.getItem('darts-cam2-' + i); return cams.some(c => c.deviceId === id) ? id : null; } catch (e) { return null; } };
  const pick0 = remembered(0) || (sorted[0] && sorted[0].deviceId);
  const pick1 = remembered(1) || (sorted.find(c => c.deviceId !== pick0) || sorted[0] || {}).deviceId;
  await startCam(boards[0], pick0);
  await startCam(boards[1], pick1);
  boards[0].input.focus();
}

// Bediening bovenin verbergen als de muis stilstaat
let hideT;
function showControls() {
  const help = document.getElementById('help');
  if (help) { help.classList.remove('hidden'); }
  if (document.body.classList.contains('tv')) return;
  document.querySelectorAll('.controls, #nav').forEach(c => c.classList.remove('hidden'));
  clearTimeout(hideT);
  hideT = setTimeout(() => {
    document.querySelectorAll('.controls, #nav').forEach(c => c.classList.add('hidden'));
    const help = document.getElementById('help'); if (help) help.classList.add('hidden');
  }, 3000);
}
document.addEventListener('mousemove', showControls);
showControls();

/* ---------- Sneltoetsen ---------- */
function tvMsg(t) {
  const m = document.getElementById('tvmsg');
  m.textContent = t; m.classList.add('show');
  clearTimeout(tvMsg.t); tvMsg.t = setTimeout(() => m.classList.remove('show'), 1600);
}
function setTv(on) {
  document.body.classList.toggle('tv', on);
  try { localStorage.setItem('darts-tv', on ? '1' : '0'); } catch (e) {}
  if (on) { document.querySelectorAll('.controls, #nav').forEach(c => c.classList.add('hidden')); tvMsg('TV-modus aan · druk H om bediening te tonen'); }
  else { showControls(); tvMsg('TV-modus uit'); }
}
try { if (localStorage.getItem('darts-tv') === '1') document.body.classList.add('tv'); } catch (e) {}

// Bord waar je mee bezig bent: dat van het actieve invoerveld, anders bord 1
const activeBoard = () => boards.find(b => document.activeElement === b.input) || boards[0];

document.addEventListener('keydown', e => {
  // Niet ingrijpen tijdens het bewerken van een spelersnaam
  if (document.activeElement && (document.activeElement.isContentEditable || document.activeElement.tagName === 'SELECT')) return;
  if (e.ctrlKey || e.altKey || e.metaKey) {
    if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(activeBoard()); }
    return;
  }
  const k = e.key.toLowerCase();
  if (e.key === 'Tab' && boards.length === 2) {
    e.preventDefault();
    const i = document.activeElement === boards[0].input ? 1 : 0;
    boards[i].input.focus();
  } else if (k === 'h') { e.preventDefault(); setTv(!document.body.classList.contains('tv')); }
  else if (k === 'f') {
    e.preventDefault();
    toggleFs();
  }
  else if (k === 'r') { e.preventDefault(); activeBoard().zoom.reset(); }
  else if (k === 'u') { e.preventDefault(); undo(activeBoard()); }
  else if (e.key === '+' || e.key === '=') { e.preventDefault(); activeBoard().zoom.step(1.25); }
  else if (e.key === '-') { e.preventDefault(); activeBoard().zoom.step(0.8); }
  else if (e.key.startsWith('Arrow') && activeBoard().zoom.zoomed()) {
    e.preventDefault();
    const d = 0.04;
    activeBoard().zoom.pan(e.key === 'ArrowLeft' ? d : e.key === 'ArrowRight' ? -d : 0, e.key === 'ArrowUp' ? d : e.key === 'ArrowDown' ? -d : 0);
  }
});

init();
</script>
